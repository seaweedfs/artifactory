name: "go: build binary (seaweed-mono)"
# The dispatch inputs ride in the run name so the runner watchdog
# (runner-watchdog.yml) can cancel a run stuck on an offline tp01 and
# re-dispatch it on hosted with the same inputs. Keep the fields parseable:
# mono:<sha> branch:<ref> runner:<tp01|hosted>.
run-name: ${{ github.workflow }}${{ (github.event.client_payload.sha || inputs.mono_sha) && format(' · mono:{0}', github.event.client_payload.sha || inputs.mono_sha) || '' }} · branch:${{ github.event.client_payload.ref || inputs.gitlab_branch || 'main' }} · runner:${{ inputs.runner || 'tp01' }}

on:
  # Triggered by seaweed-mono push (repository_dispatch)
  repository_dispatch:
    types:
      - mono-push
      - mono-merge-request

  # Allow manual triggering
  workflow_dispatch:
    inputs:
      gitlab_branch:
        description: 'seaweed-mono branch to test'
        required: false
        default: 'main'
      mono_sha:
        description: 'Exact seaweed-mono commit to test; defaults to the head of the branch above'
        required: false
        default: ''
      runner:
        description: 'Where to run: tp01 (self-hosted, no queue) or hosted (fallback when tp01 is down)'
        required: false
        type: choice
        default: tp01
        options: [tp01, hosted]
      measurement:
        description: 'Isolate this run from production: use a separate concurrency group so a real dispatch cannot cancel it'
        required: false
        type: boolean
        default: false

concurrency:
  # head_ref is empty for repository_dispatch/workflow_dispatch, so key on the
  # dispatched mono ref (or the manual branch input) to actually dedupe runs.
  group: ${{ github.event.client_payload.ref || github.event.inputs.gitlab_branch || 'main' }}${{ inputs.measurement && '/measure' || '' }}/go
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  vet:
    name: Go Vet
    runs-on: ${{ (inputs.runner || 'tp01') == 'tp01' && fromJSON('["self-hosted","tp01"]') || fromJSON('["ubuntu-24.04"]') }}
    steps:

    - name: Checkout artifactory repo
      uses: actions/checkout@v6

    - name: Runner housekeeping (self-hosted only)
      uses: ./.github/actions/runner-housekeeping

    - name: Link to seaweed-mono source
      if: github.event_name == 'repository_dispatch'
      uses: ./.github/actions/mono-source-link

    - name: Clone seaweed-mono (enterprise) source
      uses: ./.github/actions/clone-mono-source
      with:
        token: ${{ secrets.MONO_TOKEN }}
        branch: ${{ github.event.inputs.gitlab_branch }}
        sha: ${{ inputs.mono_sha }}

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'seaweedfs-source/enterprise/go.mod'
        cache: ${{ runner.environment == 'github-hosted' }}
        cache-dependency-path: 'seaweedfs-source/enterprise/go.sum'

    - name: Get dependencies
      working-directory: seaweedfs-source/enterprise/weed
      run: go get -v -t -d ./...

    - name: Go Vet (excluding protobuf lock copying)
      working-directory: seaweedfs-source/enterprise/weed
      run: |
        # Run go vet and filter out known protobuf MessageState lock copying warnings
        # These are expected in generated protobuf code with embedded sync.Mutex and are safe in practice
        go vet -v ./... 2>&1 | grep -v "MessageState contains sync.Mutex" | grep -v "IdentityAccessManagement contains sync.RWMutex" | tee vet-output.txt
        # Fail only if there are actual vet errors (not counting the filtered lock warnings)
        if grep -q "vet:" vet-output.txt; then exit 1; fi

  vet-32bit:
    name: Go Vet 32-bit
    runs-on: ${{ (inputs.runner || 'tp01') == 'tp01' && fromJSON('["self-hosted","tp01"]') || fromJSON('["ubuntu-24.04"]') }}
    steps:

    - name: Checkout artifactory repo
      uses: actions/checkout@v6

    - name: Runner housekeeping (self-hosted only)
      uses: ./.github/actions/runner-housekeeping

    - name: Clone seaweed-mono (enterprise) source
      uses: ./.github/actions/clone-mono-source
      with:
        token: ${{ secrets.MONO_TOKEN }}
        branch: ${{ github.event.inputs.gitlab_branch }}
        sha: ${{ inputs.mono_sha }}

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'seaweedfs-source/enterprise/go.mod'
        cache: ${{ runner.environment == 'github-hosted' }}
        cache-dependency-path: 'seaweedfs-source/enterprise/go.sum'

    - name: Go Vet linux/386 (type-checks for 32-bit int overflows)
      working-directory: seaweedfs-source/enterprise/weed
      run: |
        GOOS=linux GOARCH=386 go vet ./... 2>&1 | grep -v "MessageState contains sync.Mutex" | grep -v "IdentityAccessManagement contains sync.RWMutex" | tee vet-32bit-output.txt
        if grep -q "vet:" vet-32bit-output.txt; then exit 1; fi

  build:
    name: Build
    runs-on: ${{ (inputs.runner || 'tp01') == 'tp01' && fromJSON('["self-hosted","tp01"]') || fromJSON('["ubuntu-24.04"]') }}
    steps:

    - name: Checkout artifactory repo
      uses: actions/checkout@v6

    - name: Runner housekeeping (self-hosted only)
      uses: ./.github/actions/runner-housekeeping

    - name: Clone seaweed-mono (enterprise) source
      uses: ./.github/actions/clone-mono-source
      with:
        token: ${{ secrets.MONO_TOKEN }}
        branch: ${{ github.event.inputs.gitlab_branch }}
        sha: ${{ inputs.mono_sha }}

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'seaweedfs-source/enterprise/go.mod'
        cache: ${{ runner.environment == 'github-hosted' }}
        cache-dependency-path: 'seaweedfs-source/enterprise/go.sum'

    - name: Build
      working-directory: seaweedfs-source/enterprise/weed
      run: |
        echo "Building SeaweedFS with all tags..."
        go build -tags "elastic gocdk sqlite ydb tarantool tikv rclone" -v .
        # Verify binary
        echo "Verifying built binary..."
        ./weed version
        ls -lh weed

    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: weed-binary-${{ env.COMMIT_SHA }}
        path: seaweedfs-source/enterprise/weed/weed
        retention-days: 7

    - name: Go Build Summary
      if: always()
      env:
        PAYLOAD_REF: ${{ github.event.client_payload.ref }}
        INPUT_BRANCH: ${{ github.event.inputs.gitlab_branch }}
      run: |
        echo "## 🔨 Go Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### seaweed-mono Source" >> $GITHUB_STEP_SUMMARY
        echo "- **Repository**: https://github.com/seaweedfs/seaweed-mono" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ env.COMMIT_SHA }}" >> $GITHUB_STEP_SUMMARY
        BRANCH="${PAYLOAD_REF:-$INPUT_BRANCH}"; BRANCH="${BRANCH:-main}"; BRANCH="${BRANCH#refs/heads/}"
        echo "- **Branch**: $BRANCH" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Build Configuration" >> $GITHUB_STEP_SUMMARY
        echo "- **Go Version**: $(go version | cut -d' ' -f3)" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Tags**: elastic, gocdk, sqlite, ydb, tarantool, tikv, rclone" >> $GITHUB_STEP_SUMMARY
        echo "- **Target**: SeaweedFS Enterprise Edition" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f seaweedfs-source/enterprise/weed/weed ]; then
          echo "✅ **Binary built successfully and available as artifact**" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Binary build failed**" >> $GITHUB_STEP_SUMMARY
        fi

  test:
    name: Test
    runs-on: ${{ (inputs.runner || 'tp01') == 'tp01' && fromJSON('["self-hosted","tp01"]') || fromJSON('["ubuntu-24.04"]') }}
    steps:

    - name: Checkout artifactory repo
      uses: actions/checkout@v6

    - name: Runner housekeeping (self-hosted only)
      uses: ./.github/actions/runner-housekeeping

    - name: Clone seaweed-mono (enterprise) source
      uses: ./.github/actions/clone-mono-source
      with:
        token: ${{ secrets.MONO_TOKEN }}
        branch: ${{ github.event.inputs.gitlab_branch }}
        sha: ${{ inputs.mono_sha }}

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'seaweedfs-source/enterprise/go.mod'
        cache: ${{ runner.environment == 'github-hosted' }}
        cache-dependency-path: 'seaweedfs-source/enterprise/go.sum'

    # -timeout 20m: the weed/storage suite (TestMemIndexCompaction +
    # TestLDBIndexCompaction alone write 20k needles through LevelDB) can
    # exceed go test's 10m default on the self-hosted tp01 runner —
    # TestMemIndexCompaction alone took ~295s and TestLDBIndexCompaction was
    # still running at 4m21s when the 10m default fired, killing the whole
    # job with a "test timed out after 10m0s" panic. Give it headroom
    # instead of chasing the moving boundary (same rationale as test-32bit).
    - name: Test
      working-directory: seaweedfs-source/enterprise/weed
      run: go test -tags "elastic gocdk sqlite ydb tarantool tikv rclone" -v -timeout 20m ./...

  test-32bit:
    name: Test 32-bit
    runs-on: ${{ (inputs.runner || 'tp01') == 'tp01' && fromJSON('["self-hosted","tp01"]') || fromJSON('["ubuntu-24.04"]') }}
    steps:

    - name: Checkout artifactory repo
      uses: actions/checkout@v6

    - name: Runner housekeeping (self-hosted only)
      uses: ./.github/actions/runner-housekeeping

    - name: Clone seaweed-mono (enterprise) source
      uses: ./.github/actions/clone-mono-source
      with:
        token: ${{ secrets.MONO_TOKEN }}
        branch: ${{ github.event.inputs.gitlab_branch }}
        sha: ${{ inputs.mono_sha }}

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'seaweedfs-source/enterprise/go.mod'
        cache: ${{ runner.environment == 'github-hosted' }}
        cache-dependency-path: 'seaweedfs-source/enterprise/go.sum'

    # 386 test binaries run natively on the amd64 runner. This catches what vet
    # can't: unaligned 64-bit atomics and arithmetic that wraps at runtime.
    # -short skips the e2e suites already covered on amd64.
    # -timeout 20m: the weed/storage suite (TestMemIndexCompaction +
    # TestLDBIndexCompaction alone write 20k needles through LevelDB) takes
    # ~549s on main on 386 — right at go test's 10m default. A branch that adds
    # a little more I/O tips it over and the whole job dies with a
    # "test timed out after 10m0s" panic. Give it headroom instead of
    # chasing the moving boundary.
    - name: Test linux/386
      working-directory: seaweedfs-source/enterprise/weed
      run: GOOS=linux GOARCH=386 go test -short -timeout 20m ./...

  # Upstream's build-azurekms job. weed/kms/azure is excluded from every
  # default build, so without this nothing compiles it.
  build-azurekms:
    name: Build and test with azurekms tag
    runs-on: ${{ (inputs.runner || 'tp01') == 'tp01' && fromJSON('["self-hosted","tp01"]') || fromJSON('["ubuntu-24.04"]') }}
    steps:

    - name: Checkout artifactory repo
      uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Runner housekeeping (self-hosted only)
      uses: ./.github/actions/runner-housekeeping

    - name: Clone seaweed-mono (enterprise) source
      uses: ./.github/actions/clone-mono-source
      with:
        token: ${{ secrets.MONO_TOKEN }}
        branch: ${{ github.event.inputs.gitlab_branch }}
        sha: ${{ inputs.mono_sha }}

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'seaweedfs-source/enterprise/go.mod'
        cache: ${{ runner.environment == 'github-hosted' }}
        cache-dependency-path: 'seaweedfs-source/enterprise/go.sum'

    - name: Build and test with azurekms
      working-directory: seaweedfs-source/enterprise/weed
      run: |
        go build -tags azurekms ./...
        go test -tags azurekms ./kms/...

  # Unit tests only. The integration suite moved to enterprise/test/s3vectors
  # and runs per volume and query mode in s3vectors-tests.yml.
  vectors:
    name: Vector unit tests (Go gateway, Rust engine and worker)
    runs-on: ${{ (inputs.runner || 'tp01') == 'tp01' && fromJSON('["self-hosted","tp01"]') || fromJSON('["ubuntu-24.04"]') }}
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/vector-target
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/runner-housekeeping
      - uses: ./.github/actions/mono-source-link
        if: github.event_name == 'repository_dispatch'
      - uses: ./.github/actions/clone-mono-source
        with:
          token: ${{ secrets.MONO_TOKEN }}
          branch: ${{ inputs.gitlab_branch }}
          sha: ${{ inputs.mono_sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: seaweedfs-source/enterprise/go.mod
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: seaweedfs-source/enterprise/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vector-target
          key: vectors-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('seaweedfs-source/enterprise/seaweed-vector/Cargo.lock', 'seaweedfs-source/enterprise/rust/Cargo.lock', 'seaweedfs-source/enterprise/seaweed-volume/Cargo.lock') }}
          restore-keys: vectors-${{ runner.os }}-${{ runner.arch }}-
      - name: Install build dependencies
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev libssl-dev pkg-config
      # Same vendored protoc as s3vectors-tests.yml and upstream's
      # rust-vector-tests.yml, so every runner builds lance with one version.
      - name: Use the vendored protoc
        run: |
          cd seaweedfs-source/enterprise/seaweed-vector
          cargo fetch
          version=$(awk '/^name = "protoc-bin-vendored-linux-x86_64"$/{found=1; next} found && /^version = /{gsub(/"/,"",$3); print $3; exit}' Cargo.lock)
          test -n "$version" || { echo "protoc-bin-vendored-linux-x86_64 is not in Cargo.lock" >&2; exit 1; }
          protoc=$(find ~/.cargo/registry/src -path "*protoc-bin-vendored-linux-x86_64-$version/bin/protoc" | head -1)
          test -x "$protoc" || { echo "no vendored protoc $version in the registry" >&2; exit 1; }
          echo "PROTOC=$protoc" >> "$GITHUB_ENV"
      - name: Test Go vector gateway and coordinator
        working-directory: seaweedfs-source/enterprise
        run: go test -timeout 5m ./vector/coordinator ./weed/cluster ./weed/s3api/s3vectors ./weed/s3api/lance
      - name: Test sw-vector-distributed
        working-directory: seaweedfs-source/enterprise
        run: cargo test --locked --manifest-path rust/Cargo.toml -p sw-vector-distributed
      # Upstream's "Rust Vector Build and Unit Tests".
      - name: Test seaweed-vector
        working-directory: seaweedfs-source/enterprise/seaweed-vector
        run: cargo test --locked --workspace

  # Upstream's rust-worker-tests.yml.
  rust-worker:
    name: Rust plugin worker unit tests
    runs-on: ${{ (inputs.runner || 'tp01') == 'tp01' && fromJSON('["self-hosted","tp01"]') || fromJSON('["ubuntu-24.04"]') }}
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/worker-target
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/runner-housekeeping
      - uses: ./.github/actions/mono-source-link
        if: github.event_name == 'repository_dispatch'
      - uses: ./.github/actions/clone-mono-source
        with:
          token: ${{ secrets.MONO_TOKEN }}
          branch: ${{ inputs.gitlab_branch }}
          sha: ${{ inputs.mono_sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            worker-target
          key: rust-worker-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('seaweedfs-source/enterprise/seaweed-worker/Cargo.lock', 'seaweedfs-source/enterprise/seaweed-common/Cargo.lock') }}
          restore-keys: rust-worker-${{ runner.os }}-${{ runner.arch }}-
      - name: Use the vendored protoc
        run: |
          cd seaweedfs-source/enterprise/seaweed-worker
          cargo fetch
          version=$(awk '/^name = "protoc-bin-vendored-linux-x86_64"$/{found=1; next} found && /^version = /{gsub(/"/,"",$3); print $3; exit}' Cargo.lock)
          test -n "$version" || { echo "protoc-bin-vendored-linux-x86_64 is not in Cargo.lock" >&2; exit 1; }
          protoc=$(find ~/.cargo/registry/src -path "*protoc-bin-vendored-linux-x86_64-$version/bin/protoc" | head -1)
          test -x "$protoc" || { echo "no vendored protoc $version in the registry" >&2; exit 1; }
          echo "PROTOC=$protoc" >> "$GITHUB_ENV"
      # seaweed-common is a path dependency, not a workspace member, so
      # --workspace below does not reach its tests.
      - name: Test seaweed-common
        working-directory: seaweedfs-source/enterprise/seaweed-common
        run: cargo test --locked
      - name: Test seaweed-worker
        working-directory: seaweedfs-source/enterprise/seaweed-worker
        run: cargo test --locked --workspace
