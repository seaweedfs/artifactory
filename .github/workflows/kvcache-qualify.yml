name: "kvcache: qualify (seaweed-mono)"
# THIN ALIAS -- kept for one week from 2026-09-09 while callers migrate to
# qualify.yml (owner directive: generalise this workflow to pack=general|
# rotation|async|lm-e2e|all). Delete this file once nothing still dispatches
# it; until then every field below must keep matching qualify.yml's own
# workflow_dispatch inputs so a caller sees no behavior change.
#
# Forwards verbatim to qualify.yml with pack fixed to `kv-tier1`, testops'
# registered alias for the original tier-1 gate set (functional + T4/T5/T7 +
# T6-with-MySQL-as-a-container) that this workflow used to run directly.
# Everything else -- the two-ref design, mode semantics, concurrency,
# artifact/summary shape -- lives in qualify.yml now; see that file's header
# for the full pack taxonomy and design history.
run-name: ${{ github.workflow }} · mode:${{ inputs.mode || 'release-candidate' }} · product:${{ inputs.mono_ref }} · harness:${{ inputs.testops_ref }} · runner:${{ inputs.runner || 'hosted' }}

on:
  workflow_dispatch:
    inputs:
      mono_ref:
        description: 'PRODUCT: seaweed-mono ref under test (Go weed + Rust volume) -- a tag, branch, or full 40-char commit sha'
        required: true
      testops_ref:
        description: 'HARNESS: seaweed-mono ref supplying testops + sw-test-runner + scenarios/scripts/assertions -- a tag, branch, or full 40-char commit sha'
        required: false
        default: 'test/testops-phase1-upstream'
      mode:
        description: 'release-candidate expects all gates GREEN; reference-comparison expects functional GREEN and contract gates RED'
        required: false
        type: choice
        default: release-candidate
        options: [release-candidate, reference-comparison]
      runner:
        description: 'Where to run: hosted (parity proof, default) or tp01'
        required: false
        type: choice
        default: hosted
        options: [hosted, tp01]
      timeout_minutes:
        description: 'Wall-clock budget for the tier-1 pack itself (not the job)'
        required: false
        default: '45'
      measurement:
        description: 'Isolate this run from production: use a separate concurrency group so a real dispatch cannot cancel it'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  qualify:
    uses: ./.github/workflows/qualify.yml
    secrets: inherit
    with:
      pack: kv-tier1
      mono_ref: ${{ inputs.mono_ref }}
      testops_ref: ${{ inputs.testops_ref }}
      mode: ${{ inputs.mode }}
      runner: ${{ inputs.runner }}
      timeout_minutes: ${{ inputs.timeout_minutes }}
      measurement: ${{ inputs.measurement }}
