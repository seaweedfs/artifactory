name: "kvcache: qualify (seaweed-mono)"
# One-click release qualification for Seaweed KVCache, the same shape as
# seaweed-vfs-cut-release.yml gives chrislusf for artifactory releases: a mono
# ref in, a gate table out.
#
# Two jobs, one combined summary:
#   1. functional  -- Chris's own kvcache functional suite. PLACEHOLDER until
#      he lands it (mono path + invocation TBD) -- currently emits a single
#      stub gate so the combined table stays well-formed.
#   2. qualify      -- our tier-1 gates (contracts + fault gates; the
#      functional gate here is a smoke check only -- save/load/exists/delete
#      one size -- to avoid duplicating Chris's coverage). Depends on (1) and
#      merges its gate JSON into one table.
#
# Tier 1 only, host-agnostic: plain Linux + Docker, no sudo, no lab literals,
# MySQL as a container, weed-mini local -- must run GREEN on hosted first (the
# parity proof) and on tp01 second, so the runner default is hosted here,
# unlike the build/test suites. Tier 2 (T3 real RDMA + the three fault gates
# needing root scope) is "self-hosted only" from GitHub's view: the job lands
# on tp01 and drives the CX-5 pair (M01 client / M02 server) over the lab
# link -- tp01 itself has no RDMA. Parked pending the owner's credential
# ruling; not implemented by this workflow yet, see the design doc.
run-name: ${{ github.workflow }} · mono_ref:${{ inputs.mono_ref }} · tier:${{ inputs.tier }} · runner:${{ inputs.runner || 'hosted' }}

on:
  workflow_dispatch:
    inputs:
      mono_ref:
        description: 'seaweed-mono ref to qualify: a tag, or a full 40-char commit sha'
        required: true
      tier:
        description: 'Gate tier to run (only tier 1 is implemented -- host-agnostic gates)'
        required: false
        default: '1'
      runner:
        description: 'Where to run: hosted (parity proof, default) or tp01'
        required: false
        type: choice
        default: hosted
        options: [hosted, tp01]
      timeout_minutes:
        description: 'Wall-clock budget for the tier-1 pack itself (not the job)'
        required: false
        default: '30'

concurrency:
  # One qualification run at a time, full stop -- two refs qualifying
  # concurrently on the same lane is not a case this workflow needs to
  # support, and serializing avoids any doubt about which run's artifact a
  # reviewer is looking at. Never auto-cancel a qualification that is
  # running: a cancelled gate run is not the same as a passing or failing one.
  group: kvcache-qualify
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  functional:
    name: Functional (Chris's suite)
    runs-on: ${{ (inputs.runner || 'hosted') == 'tp01' && fromJSON('["self-hosted","tp01"]') || fromJSON('["ubuntu-22.04"]') }}
    timeout-minutes: 60
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:

    - name: Checkout artifactory repo
      uses: actions/checkout@v6

    - name: Runner housekeeping (self-hosted only)
      uses: ./.github/actions/runner-housekeeping

    - name: Resolve mono_ref to a commit sha
      id: resolve
      env:
        MONO_TOKEN: ${{ secrets.MONO_TOKEN }}
        MONO_REF: ${{ inputs.mono_ref }}
      run: |
        set -euo pipefail
        REMOTE="https://x-access-token:${MONO_TOKEN}@github.com/seaweedfs/seaweed-mono.git"
        # Accept a bare 40-char sha as-is; otherwise resolve a tag (or branch)
        # via ls-remote so clone-mono-source, which only takes an exact sha,
        # always gets one -- a tag on a private mirror does not fast-forward
        # the way a branch ref does, so this must be a real resolve, not a guess.
        if printf '%s' "$MONO_REF" | grep -Eq '^[0-9a-f]{40}$'; then
          SHA="$MONO_REF"
        else
          SHA="$(git ls-remote "$REMOTE" "refs/tags/${MONO_REF}" "refs/heads/${MONO_REF}" | awk '{print $1}' | head -1)"
          if [ -z "$SHA" ]; then
            echo "::error::mono_ref '$MONO_REF' did not resolve to a tag or branch on seaweed-mono" >&2
            exit 1
          fi
        fi
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"
        echo "Resolved mono_ref '$MONO_REF' -> $SHA"

    - name: Clone seaweed-mono (enterprise) source at the resolved ref
      uses: ./.github/actions/clone-mono-source
      with:
        token: ${{ secrets.MONO_TOKEN }}
        sha: ${{ steps.resolve.outputs.sha }}

    # PLACEHOLDER pending Chris's own RESULT: mono path + invocation for his
    # kvcache functional suite are not yet known. This stub keeps the
    # combined gate table well-formed (one INFRA_ERROR row) without blocking
    # job 2. Swap this step for the real invocation once he lands it -- job 2
    # and the summary-merge step do not need to change, only this step's
    # gates.json content.
    - name: Run functional suite (placeholder)
      id: run_functional
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/kvcache-functional"
        cat > "$RUNNER_TEMP/kvcache-functional/summary.json" <<'JSON'
        {"gates": [{"name": "chris-functional-suite", "status": "INFRA_ERROR", "detail": "placeholder: not yet wired to Chris's suite"}]}
        JSON
        echo "output_dir=$RUNNER_TEMP/kvcache-functional" >> "$GITHUB_OUTPUT"

    - name: Upload functional gate JSON
      if: always() && steps.run_functional.outputs.output_dir != ''
      uses: actions/upload-artifact@v4
      with:
        name: kvcache-qualify-functional-${{ steps.resolve.outputs.sha }}
        path: ${{ steps.run_functional.outputs.output_dir }}
        retention-days: 30

  qualify:
    name: Qualify (tier ${{ inputs.tier }})
    needs: functional
    runs-on: ${{ (inputs.runner || 'hosted') == 'tp01' && fromJSON('["self-hosted","tp01"]') || fromJSON('["ubuntu-22.04"]') }}
    timeout-minutes: 90
    steps:

    - name: Checkout artifactory repo
      uses: actions/checkout@v6

    - name: Runner housekeeping (self-hosted only)
      uses: ./.github/actions/runner-housekeeping

    - name: Clone seaweed-mono (enterprise) source at the resolved ref
      uses: ./.github/actions/clone-mono-source
      with:
        token: ${{ secrets.MONO_TOKEN }}
        sha: ${{ needs.functional.outputs.sha }}

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'seaweedfs-source/enterprise/go.mod'
        cache-dependency-path: 'seaweedfs-source/enterprise/go.sum'

    - name: Build weed
      working-directory: seaweedfs-source/enterprise/weed
      run: |
        go build -tags "elastic gocdk sqlite ydb tarantool tikv rclone" -o weed .
        ./weed version

    # PLACEHOLDER pending codex01's RESULT: package path for the testops CLI
    # (test/testops-phase1) is not yet confirmed at the workflow level. Update
    # the working-directory / build target below once that RESULT lands; the
    # rest of this job does not need to change.
    - name: Build testops
      working-directory: seaweedfs-source/enterprise
      run: |
        go build -o testops ./cmd/testops
        ./testops version || ./testops --version

    - name: Run tier-1 gate pack (smoke + contracts + fault gates)
      id: run_gates
      working-directory: seaweedfs-source/enterprise
      env:
        COMMIT_SHA: ${{ needs.functional.outputs.sha }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/kvcache-qualify"
        ./testops ci run \
          --pack kv-tier1 \
          --target local \
          --commit "$COMMIT_SHA" \
          --output-dir "$RUNNER_TEMP/kvcache-qualify" \
          --timeout "${{ inputs.timeout_minutes }}m"
        echo "output_dir=$RUNNER_TEMP/kvcache-qualify" >> "$GITHUB_OUTPUT"

    - name: Download functional gate JSON
      if: always()
      uses: actions/download-artifact@v4
      with:
        name: kvcache-qualify-functional-${{ needs.functional.outputs.sha }}
        path: ${{ runner.temp }}/kvcache-functional

    - name: Upload tier-1 gate JSON
      if: always() && steps.run_gates.outputs.output_dir != ''
      uses: actions/upload-artifact@v4
      with:
        name: kvcache-qualify-tier1-${{ needs.functional.outputs.sha }}
        path: ${{ steps.run_gates.outputs.output_dir }}
        retention-days: 30

    # PLACEHOLDER pending codex01's RESULT: assumes each summary.json is
    # shaped as {"gates": [{"name": str, "status": "GREEN"|"RED"|
    # "INFRA_ERROR"}, ...]}. Adjust the jq filter below, not the step
    # structure, once the actual schema is confirmed. Merges job 1's
    # (functional) and job 2's (tier-1) gates into one table, as requested.
    - name: Render combined gate summary
      if: always()
      env:
        FUNC_JSON: ${{ runner.temp }}/kvcache-functional/summary.json
        TIER1_JSON: ${{ steps.run_gates.outputs.output_dir }}/summary.json
        MONO_SHA: ${{ needs.functional.outputs.sha }}
      run: |
        set -uo pipefail
        {
          echo "## KVCache qualification — tier ${{ inputs.tier }}"
          echo ""
          echo "mono ref \`${{ inputs.mono_ref }}\` @ \`$MONO_SHA\`, runner \`${{ inputs.runner || 'hosted' }}\`"
          echo ""
          echo "| Gate | Status |"
          echo "|---|---|"
        } >> "$GITHUB_STEP_SUMMARY"
        RED_COUNT=0
        for f in "$FUNC_JSON" "$TIER1_JSON"; do
          if [ ! -f "$f" ]; then
            echo "::warning::missing $f — its gates are absent from the combined table"
            continue
          fi
          while IFS=$'\t' read -r name status; do
            case "$status" in
              GREEN) label="success" ;;
              RED) label="failure"; RED_COUNT=$((RED_COUNT + 1)) ;;
              INFRA_ERROR) label="neutral" ;;
              *) label="unknown" ;;
            esac
            echo "| $name | $label ($status) |" >> "$GITHUB_STEP_SUMMARY"
          done < <(jq -r '.gates[] | [.name, .status] | @tsv' "$f")
        done
        # A RED gate is a real regression and fails the job. An INFRA_ERROR
        # gate (host/tooling gap, or -- right now -- Chris's suite not being
        # wired up yet, not the code under test) is reported but does not
        # fail the job: the "neutral" mapping from the REQUEST, distinct from
        # both a pass and a genuine failure.
        if [ "$RED_COUNT" -gt 0 ]; then
          echo "::error::$RED_COUNT gate(s) RED"
          exit 1
        fi
