name: "kvcache: qualify (seaweed-mono)"
# One-click release qualification for Seaweed KVCache, the same shape as
# seaweed-vfs-cut-release.yml gives chrislusf for artifactory releases: a mono
# ref in, a gate table out.
#
# One job: our tier-1 gate pack (full functional gate + T4/T5/T7 +
# T6-with-MySQL-as-a-container -- codex01's host-agnostic classification of
# the 17 KV gates). Host-agnostic by construction: plain Linux + Docker, no
# sudo, no lab literals -- must run GREEN on hosted first (the parity proof)
# and on tp01 second, so the runner default here is hosted, unlike the
# build/test suites.
#
# Two-ref design (ruled 2026-09-08, codex01's contract a): a release-
# qualification action pins the TOOLING and varies the PRODUCT. mono_ref is
# the PRODUCT SHA under test (Go weed + Rust volume); testops_ref is the
# HARNESS SHA (testops + sw-test-runner + scenarios/scripts/assertions),
# defaulting to the #598 branch head. Two clean, independent checkouts --
# never one ref standing in for both -- because a reference commit
# (chrislusf's own, pre-hardening) does not carry the harness at all: the
# first attempt at this (single checkout, ref = mono_ref for everything)
# failed hard on 61748b3f5 with "testops/cmd/testops: directory not found"
# (run 34272566294). `mode` selects the expected-outcome shape: release-
# candidate (all gates GREEN) vs reference-comparison (functional GREEN,
# contract gates RED is expected, not a failure).
#
# Invocation wired verbatim from enterprise/testops/packs/kv/CI.md at
# tooling commit 6f29559 (test/testops-phase1-upstream, applying codex01's
# docs/patches/testops-two-ref.patch from fix/kvcache-batches-hardening-v2 @
# bb797501): --source-dir/--tooling-commit for the harness checkout,
# --product-dir/--commit for the product checkout. There is no --mode flag
# in the CLI -- `mode` is a workflow-level label only, echoed into the
# summary, not passed to testops.
#
# Tier 2 (T3 real RDMA + the three fault gates needing root scope) is
# "self-hosted only" from GitHub's view: a future phase-2 job that lands on
# tp01 and drives the CX-5 pair (M01 client / M02 server) over the lab link --
# tp01 itself has no RDMA. Parked pending the owner's credential ruling; not
# implemented by this workflow yet.
run-name: ${{ github.workflow }} · mode:${{ inputs.mode || 'release-candidate' }} · product:${{ inputs.mono_ref }} · harness:${{ inputs.testops_ref }} · runner:${{ inputs.runner || 'hosted' }}

on:
  workflow_dispatch:
    inputs:
      mono_ref:
        description: 'PRODUCT: seaweed-mono ref under test (Go weed + Rust volume) -- a tag, branch, or full 40-char commit sha'
        required: true
      testops_ref:
        description: 'HARNESS: seaweed-mono ref supplying testops + sw-test-runner + scenarios/scripts/assertions -- a tag, branch, or full 40-char commit sha'
        required: false
        default: 'test/testops-phase1-upstream'
      mode:
        description: 'release-candidate expects all gates GREEN; reference-comparison expects functional GREEN and contract gates RED'
        required: false
        type: choice
        default: release-candidate
        options: [release-candidate, reference-comparison]
      tier:
        description: 'Gate tier to run (only tier 1 is implemented -- host-agnostic gates)'
        required: false
        default: '1'
      runner:
        description: 'Where to run: hosted (parity proof, default) or tp01'
        required: false
        type: choice
        default: hosted
        options: [hosted, tp01]
      timeout_minutes:
        description: 'Wall-clock budget for the tier-1 pack itself (not the job)'
        required: false
        default: '45'
      measurement:
        description: 'Isolate this run from production: use a separate concurrency group so a real dispatch cannot cancel it'
        required: false
        type: boolean
        default: false

concurrency:
  # One qualification run at a time, full stop -- two refs qualifying
  # concurrently on the same lane is not a case this workflow needs to
  # support, and serializing avoids any doubt about which run's artifact a
  # reviewer is looking at. Never auto-cancel a qualification that is
  # running: a cancelled gate run is not the same as a passing or failing one.
  # One holder per (runner, product ref, harness ref): a hosted candidate and
  # a tp01 reference must not queue behind each other, and neither should a
  # release-candidate run and a reference-comparison run on the same product
  # ref with different harnesses; only true duplicates (same everything) wait.
  group: kvcache-qualify${{ inputs.measurement && '/measure' || '' }}/${{ inputs.runner || 'hosted' }}/${{ inputs.mono_ref }}/${{ inputs.testops_ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify (tier ${{ inputs.tier }})
    runs-on: ${{ (inputs.runner || 'hosted') == 'tp01' && fromJSON('["self-hosted","tp01"]') || fromJSON('["ubuntu-22.04"]') }}
    timeout-minutes: 90
    steps:

    - name: Checkout artifactory repo
      uses: actions/checkout@v6

    - name: Runner housekeeping (self-hosted only)
      uses: ./.github/actions/runner-housekeeping

    - name: Resolve product ref (mono_ref) to a commit sha
      id: resolve_product
      env:
        MONO_TOKEN: ${{ secrets.MONO_TOKEN }}
        MONO_REF: ${{ inputs.mono_ref }}
      run: |
        set -euo pipefail
        REMOTE="https://x-access-token:${MONO_TOKEN}@github.com/seaweedfs/seaweed-mono.git"
        # Accept a bare 40-char sha as-is; otherwise resolve a tag (or branch)
        # via ls-remote so clone-mono-source, which only takes an exact sha,
        # always gets one -- a tag on a private mirror does not fast-forward
        # the way a branch ref does, so this must be a real resolve, not a guess.
        if printf '%s' "$MONO_REF" | grep -Eq '^[0-9a-f]{40}$'; then
          SHA="$MONO_REF"
        else
          SHA="$(git ls-remote "$REMOTE" "refs/tags/${MONO_REF}" "refs/heads/${MONO_REF}" | awk '{print $1}' | head -1)"
          if [ -z "$SHA" ]; then
            echo "::error::mono_ref (product) '$MONO_REF' did not resolve to a tag or branch on seaweed-mono" >&2
            exit 1
          fi
        fi
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"
        echo "Resolved product mono_ref '$MONO_REF' -> $SHA"

    - name: Resolve harness ref (testops_ref) to a commit sha
      id: resolve_harness
      env:
        MONO_TOKEN: ${{ secrets.MONO_TOKEN }}
        TESTOPS_REF: ${{ inputs.testops_ref || 'test/testops-phase1-upstream' }}
      run: |
        set -euo pipefail
        REMOTE="https://x-access-token:${MONO_TOKEN}@github.com/seaweedfs/seaweed-mono.git"
        if printf '%s' "$TESTOPS_REF" | grep -Eq '^[0-9a-f]{40}$'; then
          SHA="$TESTOPS_REF"
        else
          SHA="$(git ls-remote "$REMOTE" "refs/tags/${TESTOPS_REF}" "refs/heads/${TESTOPS_REF}" | awk '{print $1}' | head -1)"
          if [ -z "$SHA" ]; then
            echo "::error::testops_ref (harness) '$TESTOPS_REF' did not resolve to a tag or branch on seaweed-mono" >&2
            exit 1
          fi
        fi
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"
        echo "Resolved harness testops_ref '$TESTOPS_REF' -> $SHA"

    # PRODUCT checkout: Go weed + Rust volume under test. Path kept as
    # `seaweedfs-source` (existing convention elsewhere in this repo).
    - name: Clone seaweed-mono (product) source at the resolved product sha
      uses: ./.github/actions/clone-mono-source
      with:
        token: ${{ secrets.MONO_TOKEN }}
        sha: ${{ steps.resolve_product.outputs.sha }}
        path: seaweedfs-source

    # HARNESS checkout: testops + sw-test-runner + scenarios/scripts/
    # assertions. Independent tree, independent sha -- this is the whole
    # point of the two-ref design: a reference commit that predates the
    # harness must still be qualifiable, by supplying the harness from a
    # ref that has it.
    - name: Clone seaweed-mono (harness) source at the resolved harness sha
      uses: ./.github/actions/clone-mono-source
      with:
        token: ${{ secrets.MONO_TOKEN }}
        sha: ${{ steps.resolve_harness.outputs.sha }}
        path: seaweedfs-harness

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'seaweedfs-source/enterprise/go.mod'
        cache-dependency-path: 'seaweedfs-source/enterprise/go.sum'

    - name: Install grpcurl
      # Every other required host tool (bash, cargo, curl, docker, git, go,
      # jq, sha256sum, ss) is already on both ubuntu-22.04 and tp01; grpcurl
      # is the one gap. go install puts it on GOPATH/bin, already on PATH via
      # actions/setup-go. Pinned, not @latest: a qualification workflow must
      # build the same tool on every run, not whatever grpcurl shipped today.
      run: go install github.com/fullstorydev/grpcurl/cmd/grpcurl@v1.9.4

    # Built from the HARNESS checkout, not the product one -- this is the
    # fix for the failure the single-checkout design hit on 61748b3f5
    # (testops/cmd/testops did not exist at that product commit; run
    # 34272566294). Built to $RUNNER_TEMP, not `enterprise/testops` as
    # CI.md's own example literally shows: enterprise/testops/ is ALSO the
    # testops package's own source root (agent.go, coordinator.go, cmd/,
    # ...), so `go build -o testops` there is a same-name collision -- go
    # silently places the binary INSIDE that directory instead of
    # overwriting it, and `./testops` then fails with "Is a directory"
    # (found live on 34260061227). Same collision-avoidance pattern already
    # used for `weed` in kafka-tests.yml/s3tests.yml.
    - name: Build testops (from the harness checkout)
      working-directory: seaweedfs-harness/enterprise
      run: |
        mkdir -p "$RUNNER_TEMP/bin"
        go build -o "$RUNNER_TEMP/bin/testops" ./testops/cmd/testops
        "$RUNNER_TEMP/bin/testops" version || "$RUNNER_TEMP/bin/testops" --version

    - name: Run tier-1 gate pack (functional + T4/T5/T7 + T6-with-MySQL-container)
      id: run_gates
      # Belt-and-braces on top of the in-script `set +e` capture below: if
      # the shell itself dies (OOM, segfault, a signal) rather than testops
      # returning a normal exit code, GITHUB_OUTPUT is never written at all,
      # not even with `set +e`. continue-on-error here means that failure
      # mode still reaches Upload/Render (both already `if: always()`) and
      # the explicit Enforce step below, instead of the job just stopping
      # silently at this step with no artifact and no explanation.
      continue-on-error: true
      working-directory: seaweedfs-harness/enterprise
      env:
        PRODUCT_SHA: ${{ steps.resolve_product.outputs.sha }}
        HARNESS_SHA: ${{ steps.resolve_harness.outputs.sha }}
        TOOLING_DIR: ${{ github.workspace }}/seaweedfs-harness
        PRODUCT_DIR: ${{ github.workspace }}/seaweedfs-source
      run: |
        # GitHub invokes run: blocks as `bash -e {0}`; `set -uo pipefail`
        # alone does NOT cancel that inherited -e. testops exiting 1 (RED) or
        # 2 (INFRA_ERROR) is an expected, meaningful result here, not a
        # script bug -- without `set +e` the shell aborts right at that exit
        # and every line below (the exit-code capture, both outputs) never
        # runs, silently skipping Upload/Render downstream (found live on
        # 34261444330: a real RED T6 gate never reached the summary at all,
        # same inherited-set-e class of bug as job-completed-reap.sh).
        set +e -uo pipefail
        OUT_DIR="$RUNNER_TEMP/seaweed-kvcache-qualification"
        mkdir -p "$OUT_DIR"
        # Host-owned absolute paths per CI.md; RUNNER_TEMP is unique per job
        # so two qualify runs (this concurrency group serializes them anyway)
        # never share a lock file or cargo target dir.
        export TESTOPS_LOCK_FILE="$RUNNER_TEMP/testops-ci.lock"
        export TESTOPS_CARGO_TARGET_DIR="$RUNNER_TEMP/cargo-target"

        # Wired verbatim from enterprise/testops/packs/kv/CI.md (tooling
        # 6f29559, applying codex01's testops-two-ref.patch): --source-dir /
        # --tooling-commit supply sw-test-runner, scenarios, scripts and the
        # T7 fixture from the harness checkout; --product-dir / --commit
        # supply Go weed + Rust weed-volume from the product checkout. There
        # is no --mode flag in the CLI -- release-candidate vs
        # reference-comparison is a workflow-level label only (echoed into
        # the summary below), not something testops itself takes.
        "$RUNNER_TEMP/bin/testops" ci run \
          --pack kv-tier1 \
          --target local \
          --source-dir "$TOOLING_DIR" \
          --tooling-commit "$HARNESS_SHA" \
          --product-dir "$PRODUCT_DIR" \
          --commit "$PRODUCT_SHA" \
          --output-dir "$OUT_DIR" \
          --timeout "${{ inputs.timeout_minutes }}m"
        # 0 GREEN, 1 a real RED assertion, 2 INFRA_ERROR (preflight/build/
        # timeout/evidence) -- capture rather than let set -e stop the job
        # before the summary/upload steps below can run, then re-exit with it
        # so this step's own conclusion (and the job's) still reflects testops'.
        EXIT_CODE=$?
        echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
        echo "output_dir=$OUT_DIR" >> "$GITHUB_OUTPUT"
        exit "$EXIT_CODE"

    - name: Upload gate JSON
      if: always() && steps.run_gates.outputs.output_dir != ''
      uses: actions/upload-artifact@v4
      with:
        name: kvcache-qualify-${{ steps.resolve_product.outputs.sha }}-${{ steps.resolve_harness.outputs.sha }}
        path: ${{ steps.run_gates.outputs.output_dir }}
        retention-days: 30

    # Schema per enterprise/testops/packs/kv/CI.md (testops.ci.summary/v1):
    # top-level {schema,pack,target,commit,status,exit_code,started_at,
    # finished_at,duration_s,gates:[{gate_id,scenario,status,run_id,
    # duration_s,result_file}]}. testops' own exit code (0/1/2, captured by
    # the previous step) already decides the job's pass/fail -- this step
    # only renders the table for a human reader. Product SHA, harness SHA
    # and mode are always echoed (ruled 2026-09-08: results must record both
    # SHAs, expected vs actual outcome shape) regardless of whether a
    # summary.json exists.
    - name: Render gate summary
      if: always() && steps.run_gates.outputs.output_dir != ''
      env:
        OUT_DIR: ${{ steps.run_gates.outputs.output_dir }}
        PRODUCT_SHA: ${{ steps.resolve_product.outputs.sha }}
        HARNESS_SHA: ${{ steps.resolve_harness.outputs.sha }}
        EXIT_CODE: ${{ steps.run_gates.outputs.exit_code }}
      run: |
        set -uo pipefail
        SUMMARY_JSON="$OUT_DIR/summary.json"
        {
          echo "## KVCache qualification — tier ${{ inputs.tier }}, mode \`${{ inputs.mode || 'release-candidate' }}\`"
          echo ""
          echo "product (mono_ref) \`${{ inputs.mono_ref }}\` @ \`$PRODUCT_SHA\`"
          echo ""
          echo "harness (testops_ref) \`${{ inputs.testops_ref || 'test/testops-phase1-upstream' }}\` @ \`$HARNESS_SHA\`"
          echo ""
          echo "runner \`${{ inputs.runner || 'hosted' }}\`, testops exit \`$EXIT_CODE\`"
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"
        PROVENANCE_JSON="$OUT_DIR/build-provenance.json"
        if [ -f "$PROVENANCE_JSON" ]; then
          {
            echo "binary digests (build-provenance.json):"
            echo '```json'
            cat "$PROVENANCE_JSON"
            echo '```'
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
        fi
        if [ ! -f "$SUMMARY_JSON" ]; then
          echo "::warning::no summary.json in $OUT_DIR — gate table skipped, see uploaded artifact for raw output"
          echo "**No summary.json produced (exit $EXIT_CODE); see the uploaded artifact.**" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        {
          echo "overall pack status: \`$(jq -r '.status' "$SUMMARY_JSON")\`, duration $(jq -r '.duration_s' "$SUMMARY_JSON")s"
          echo ""
          echo "| Gate | Status |"
          echo "|---|---|"
        } >> "$GITHUB_STEP_SUMMARY"
        while IFS=$'\t' read -r name status; do
          case "$status" in
            GREEN) label="success" ;;
            RED) label="failure" ;;
            INFRA_ERROR) label="neutral" ;;
            *) label="unknown" ;;
          esac
          echo "| $name | $label ($status) |" >> "$GITHUB_STEP_SUMMARY"
        done < <(jq -r '.gates[] | [(.scenario // .gate_id), .status] | @tsv' "$SUMMARY_JSON")

    # continue-on-error on the gate-pack step means GitHub shows that step
    # (and, without this, the job) as green no matter what testops returned.
    # This is the step that actually decides the job's pass/fail: missing
    # entirely (the shell died before writing any output) counts as a
    # failure, same as a captured non-zero exit code.
    - name: Enforce gate result
      if: always()
      env:
        EXIT_CODE: ${{ steps.run_gates.outputs.exit_code }}
      run: |
        if [ -z "$EXIT_CODE" ]; then
          echo "::error::run_gates produced no exit_code output -- the shell likely died before it could write one (OOM, signal, crash)"
          exit 1
        fi
        exit "$EXIT_CODE"
