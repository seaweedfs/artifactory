name: "S3 Tigris Compatibility Tests (seaweed-mono)"
# The dispatch inputs ride in the run name so the runner watchdog
# (runner-watchdog.yml) can cancel a run stuck on an offline tp01 and
# re-dispatch it on hosted with the same inputs. Keep the fields parseable:
# mono:<sha> branch:<ref> runner:<tp01|hosted>.
run-name: ${{ github.workflow }}${{ (github.event.client_payload.sha || inputs.mono_sha) && format(' · mono:{0}', github.event.client_payload.sha || inputs.mono_sha) || '' }} · branch:${{ github.event.client_payload.ref || inputs.gitlab_branch || 'main' }} · runner:${{ inputs.runner || 'hosted' }}

on:
  repository_dispatch:
    types:
      - mono-push
      - mono-merge-request

  workflow_dispatch:
    inputs:
      gitlab_branch:
        description: 'seaweed-mono branch to test'
        required: false
        default: 'main'
      mono_sha:
        description: 'Exact seaweed-mono commit to test; defaults to the head of the branch above'
        required: false
        default: ''
      runner:
        description: 'Where to run: tp01 (self-hosted, no queue) or hosted (fallback when tp01 is down)'
        required: false
        type: choice
        default: hosted
        options: [tp01, hosted]
      measurement:
        description: 'Isolate this run from production: use a separate concurrency group so a real dispatch cannot cancel it'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.event.client_payload.ref || github.event.inputs.gitlab_branch || 'main' }}${{ inputs.measurement && '/measure' || '' }}/s3-tigris-compat-tests
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  s3-tigris-compat-tests:
    name: s3-api-compat-tests (Tigris)
    # The suite's weed mini binds fixed ports (8335 / 9335 / 8085 / 8889 /
    # 7335 / 23647), so on tp01 it waits on the shared host-port flock. A
    # hosted runner is a fresh VM per job and gets a unique group key.
    concurrency:
      group: ${{ format('hosted-{0}-{1}-{2}', github.run_id, 's3-tigris-compat-tests', strategy.job-index) }}
      cancel-in-progress: false
    runs-on: ${{ (inputs.runner || 'hosted') == 'tp01' && fromJSON('["self-hosted","tp01"]') || fromJSON('["ubuntu-24.04"]') }}
    timeout-minutes: ${{ (inputs.runner || 'hosted') == 'tp01' && 100 || 20 }}

    steps:
      - name: Checkout artifactory repo
        uses: actions/checkout@v6

      - name: Runner housekeeping (self-hosted only)
        uses: ./.github/actions/runner-housekeeping

      - name: Wait for the tp01 host-port lock (self-hosted only)
        if: (inputs.runner || 'hosted') == 'tp01'
        uses: ./.github/actions/tp01-host-lock
        with:
          mode: acquire

      - name: Link to seaweed-mono source
        if: github.event_name == 'repository_dispatch'
        uses: ./.github/actions/mono-source-link

      - name: Clone seaweed-mono (enterprise) source
        uses: ./.github/actions/clone-mono-source
        with:
          token: ${{ secrets.MONO_TOKEN }}
          branch: ${{ github.event.inputs.gitlab_branch }}
          sha: ${{ inputs.mono_sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'seaweedfs-source/enterprise/go.mod'
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: 'seaweedfs-source/enterprise/go.sum'

      - name: Run s3-api-compat-tests
        timeout-minutes: 15
        working-directory: seaweedfs-source/enterprise/test/s3/tigris_compat
        run: make test

      - name: Show server log on failure
        if: failure()
        working-directory: seaweedfs-source/enterprise/test/s3/tigris_compat
        run: tail -200 weed-test.log || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s3-tigris-compat-results
          path: seaweedfs-source/enterprise/test/s3/tigris_compat/results.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Release the tp01 host-port lock (self-hosted only)
        if: always() && (inputs.runner || 'hosted') == 'tp01'
        uses: ./.github/actions/tp01-host-lock
        with:
          mode: release
