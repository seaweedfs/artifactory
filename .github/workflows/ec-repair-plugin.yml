name: "EC Repair Plugin Worker (seaweed-mono)"
# The dispatch inputs ride in the run name so the runner watchdog
# (runner-watchdog.yml) can cancel a run stuck on an offline tp01 and
# re-dispatch it on hosted with the same inputs. Keep the fields parseable:
# mono:<sha> branch:<ref> runner:<tp01|hosted>.
run-name: ${{ github.workflow }}${{ (github.event.client_payload.sha || inputs.mono_sha) && format(' · mono:{0}', github.event.client_payload.sha || inputs.mono_sha) || '' }} · branch:${{ github.event.client_payload.ref || inputs.gitlab_branch || 'main' }} · runner:${{ inputs.runner || 'tp01' }}

on:
  repository_dispatch:
    types:
      - mono-push
      - mono-merge-request
  workflow_dispatch:
    inputs:
      gitlab_branch:
        description: 'seaweed-mono branch to test'
        required: false
        default: 'main'
      mono_sha:
        description: 'Exact seaweed-mono commit to test; defaults to the head of the branch above'
        required: false
        default: ''
      runner:
        description: 'Where to run: tp01 (self-hosted, no queue) or hosted (fallback when tp01 is down)'
        required: false
        type: choice
        default: tp01
        options: [tp01, hosted]
      measurement:
        description: 'Isolate this run from production: use a separate concurrency group so a real dispatch cannot cancel it'
        required: false
        type: boolean
        default: false

concurrency:
  # head_ref is empty for repository_dispatch/workflow_dispatch, so key on the
  # dispatched mono ref (or the manual branch input) to actually dedupe runs.
  group: ${{ github.event.client_payload.ref || github.event.inputs.gitlab_branch || 'main' }}${{ inputs.measurement && '/measure' || '' }}/ec-repair-plugin
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ec-repair-plugin:
    name: EC Repair Plugin Worker E2E
    runs-on: ${{ (inputs.runner || 'tp01') == 'tp01' && fromJSON('["self-hosted","tp01"]') || fromJSON('["ubuntu-22.04"]') }}
    timeout-minutes: 20
    steps:
    - name: Checkout artifactory repo
      uses: actions/checkout@v6

    - name: Runner housekeeping (self-hosted only)
      uses: ./.github/actions/runner-housekeeping

    - name: Link to seaweed-mono source
      if: github.event_name == 'repository_dispatch'
      uses: ./.github/actions/mono-source-link

    - name: Clone seaweed-mono (enterprise) source
      uses: ./.github/actions/clone-mono-source
      with:
        token: ${{ secrets.MONO_TOKEN }}
        branch: ${{ github.event.inputs.gitlab_branch }}
        sha: ${{ inputs.mono_sha }}

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'seaweedfs-source/enterprise/go.mod'
        cache-dependency-path: 'seaweedfs-source/enterprise/go.sum'
      id: go

    - name: Build weed binary
      working-directory: seaweedfs-source/enterprise/weed
      run: |
        echo "Building SeaweedFS weed binary..."
        go build -o weed .
        ./weed version
        echo "$(pwd)" >> $GITHUB_PATH

    - name: Run EC Repair Plugin Worker Test
      working-directory: seaweedfs-source/enterprise
      env:
        WEED_BINARY: ${{ github.workspace }}/seaweedfs-source/enterprise/weed/weed
      run: |
        bash "$GITHUB_WORKSPACE/.github/scripts/test-ec-repair-plugin.sh"

    - name: Archive test logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ec-repair-plugin-logs-${{ env.COMMIT_SHA }}
        path: |
          /tmp/ec-repair-test-*/*.log
        if-no-files-found: ignore
        retention-days: 7

    - name: Test Summary
      if: always()
      run: |
        echo "## EC Repair Plugin Worker Test" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${COMMIT_SHA:-${GITHUB_SHA:0:8}}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### What this tests" >> $GITHUB_STEP_SUMMARY
        echo "1. Start weed mini + 13 volume servers" >> $GITHUB_STEP_SUMMARY
        echo "2. Upload data, EC-encode via erasure_coding plugin worker" >> $GITHUB_STEP_SUMMARY
        echo "3. Simulate shard loss (kill node, delete shard files, restart)" >> $GITHUB_STEP_SUMMARY
        echo "4. Trigger ec_repair plugin worker via admin API" >> $GITHUB_STEP_SUMMARY
        echo "5. Verify all shards restored, no /tmp leaks, clean detection" >> $GITHUB_STEP_SUMMARY
