name: "Binaries: Build and Release SeaweedFS Enterprise"

on:
  push:
    tags:
      - '*'
      - '!vfs-*'   # vfs-<version> tags publish via seaweed-vfs-release.yml
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish the binaries to (e.g. 4.45.2); created when missing'
        required: true

permissions:
  contents: write

# Two runs publishing to one release would race each other's asset overwrites.
concurrency:
  group: binaries-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag_name || github.ref_name }}

jobs:
  # Everything that can fail cheaply, before a dozen builds start: the release
  # tag must match the enterprise version constants in seaweed-mono, so a
  # stale (unsynced) enterprise build never ships under a newer tag, and the
  # release the assets upload to must exist, since the uploader below only
  # attaches to an existing one.
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout artifactory repo
        uses: actions/checkout@v6

      - name: Verify enterprise version matches release tag
        uses: ./.github/actions/verify-enterprise-version
        with:
          tag: ${{ env.TAG }}
          mono-token: ${{ secrets.MONO_TOKEN }}

      - name: Ensure the release exists
        uses: ./.github/actions/ensure-release
        with:
          tag: ${{ env.TAG }}
          token: ${{ secrets.GITHUB_TOKEN }}

  build-release-binaries:
    needs: [prepare-release]
    runs-on: ubuntu-latest
    strategy:
      # A platform that cannot build or upload is that platform's problem, not
      # the other eleven's: without this, one failure cancels the rest mid-run
      # and the release lands with holes in it.
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows, freebsd, openbsd]
        goarch: [amd64, arm, arm64]
        exclude:
          # Windows on ARM64 is not commonly used
          - goos: windows
            goarch: arm64
          # Windows on ARM is not commonly used
          - goos: windows
            goarch: arm
          # Darwin on ARM is not supported
          - goos: darwin
            goarch: arm

    steps:
      # Checkout the current artifactory repo (just to have the workflow)
      - name: Checkout artifactory repo
        uses: actions/checkout@v6

      # Clone the private seaweed-mono repository (SeaweedFS Enterprise)
      - name: Clone seaweed-mono (enterprise) source
        env:
          MONO_TOKEN: ${{ secrets.MONO_TOKEN }}
        run: |
          .github/scripts/git-retry.sh clone -b main https://x-access-token:${MONO_TOKEN}@github.com/seaweedfs/seaweed-mono.git seaweedfs-enterprise-source
          cd seaweedfs-enterprise-source
          echo "Cloned enterprise branch commit: $(git rev-parse HEAD)"
          echo "COMMIT_SHA=$(git rev-parse --short=8 HEAD)" >> $GITHUB_ENV

      # Build and Release Normal Volume Size Binary (Enterprise)
      - name: Go Release Binaries Normal Volume Size
        uses: wangyoucao577/go-release-action@481a2c1a0f1be199722e3e9b74d7199acafc30a8 # v1.22
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          release_tag: ${{ env.TAG }}
          overwrite: true
          pre_command: export CGO_ENABLED=0 && export GODEBUG=http2client=0
          build_flags: -buildvcs=false
          ldflags: -s -w -extldflags -static -X github.com/seaweedfs/seaweedfs/weed/util/version.COMMIT=${{ env.COMMIT_SHA }}
          project_path: seaweedfs-enterprise-source/enterprise/weed
          binary_name: weed
          asset_name: "weed-enterprise-${{ matrix.goos }}_${{ matrix.goarch }}"

      # Build and Release Large Disk Binary (Enterprise)
      - name: Go Release Large Disk Binaries
        uses: wangyoucao577/go-release-action@481a2c1a0f1be199722e3e9b74d7199acafc30a8 # v1.22
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          release_tag: ${{ env.TAG }}
          overwrite: true
          pre_command: export CGO_ENABLED=0 && export GODEBUG=http2client=0
          build_flags: -buildvcs=false -tags 5BytesOffset
          ldflags: -s -w -extldflags -static -X github.com/seaweedfs/seaweedfs/weed/util/version.COMMIT=${{ env.COMMIT_SHA }}
          project_path: seaweedfs-enterprise-source/enterprise/weed
          binary_name: weed
          asset_name: "weed-enterprise-${{ matrix.goos }}_${{ matrix.goarch }}_large_disk" 