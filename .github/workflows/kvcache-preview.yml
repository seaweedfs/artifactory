name: "KVCache: Publish LMCache preview"

on:
  workflow_dispatch:
    inputs:
      mono_sha:
        description: "Full seaweed-mono source SHA"
        required: true
        default: "0d5ea8a702ceb85659d562b08457b94a81f894b1"
      release_tag:
        description: "Existing artifactory prerelease tag"
        required: true
        default: "kvcache-filer-native-v0.1.0-preview.1"
  push:
    branches:
      - release/kvcache-preview-artifactory
    paths:
      - .github/workflows/kvcache-preview.yml

permissions:
  contents: write
  packages: write

concurrency:
  group: kvcache-preview-${{ inputs.release_tag || 'kvcache-filer-native-v0.1.0-preview.1' }}
  cancel-in-progress: false

env:
  MONO_SHA: ${{ inputs.mono_sha || '0d5ea8a702ceb85659d562b08457b94a81f894b1' }}
  LMCACHE_SHA: f2b65521c55f55d6c146277f004153e185e5d73a
  RELEASE_TAG: ${{ inputs.release_tag || 'kvcache-filer-native-v0.1.0-preview.1' }}
  SERVER_IMAGE: ghcr.io/seaweedfs/seaweedfs-enterprise:kvcache-v0.1.0-preview.1-rdma
  RUNTIME_IMAGE: ghcr.io/seaweedfs/lmcache-seaweed:v0.1.0-preview.1
  EXPECTED_WHEEL_SHA256: 4349943eb5198c22fa094e9db55d3206846d96427da94e6d700e4f712868fe37

# One job, not three. Every job is a separate runner acquisition, and this
# organization queues a median of ~30 minutes per job regardless of label, so
# three jobs cost three queue waits for 19 minutes of work. See issue #77.
jobs:
  publish-preview:
    name: Build and publish KVCache preview images
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af --volumes || true
          df -h /

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse verified server image when present
        id: server
        run: |
          set -euo pipefail
          if docker pull "$SERVER_IMAGE"; then
            repo_digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$SERVER_IMAGE")
            if test -n "$repo_digest" && \
               docker run --rm "$repo_digest" version | grep -Fq "$MONO_SHA"; then
              printf '%s\n' "$repo_digest" > server-image.txt
              echo 'reuse=true' >> "$GITHUB_OUTPUT"
            else
              echo "published server image does not match MONO_SHA=$MONO_SHA; rebuilding"
              echo 'reuse=false' >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
          fi

      # Mirrors the server check above. Without it the runtime image was rebuilt
      # from scratch (~17 min) on every run, even when the published image
      # already carried the expected source SHAs and wheel checksum.
      - name: Reuse verified runtime image when present
        id: runtime
        run: |
          set -euo pipefail
          if docker pull "$RUNTIME_IMAGE"; then
            repo_digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$RUNTIME_IMAGE")
            if test -n "$repo_digest" && \
               test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$repo_digest")" = "$MONO_SHA" && \
               test "$(docker inspect --format '{{index .Config.Labels "ai.lmcache.source-revision"}}' "$repo_digest")" = "$LMCACHE_SHA" && \
               test "$(docker inspect --format '{{index .Config.Labels "ai.lmcache.wheel.sha256"}}' "$repo_digest")" = "$EXPECTED_WHEEL_SHA256" && \
               docker run --rm "$repo_digest" \
                 python -c 'from seaweedkv_native import SeaweedKVNativeConnector; print(SeaweedKVNativeConnector)'; then
              printf '%s\n' "$repo_digest" > runtime-image.txt
              echo 'reuse=true' >> "$GITHUB_OUTPUT"
            else
              echo "published runtime image does not match the requested provenance; rebuilding"
              echo 'reuse=false' >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout frozen seaweed-mono source
        if: steps.server.outputs.reuse != 'true' || steps.runtime.outputs.reuse != 'true'
        env:
          MONO_TOKEN: ${{ secrets.MONO_TOKEN }}
        run: |
          set -euo pipefail
          test "${#MONO_SHA}" -eq 40
          git init mono
          git -C mono remote add origin "https://x-access-token:${MONO_TOKEN}@github.com/seaweedfs/seaweed-mono.git"
          git -C mono fetch --depth 1 origin "$MONO_SHA"
          git -C mono checkout --detach FETCH_HEAD
          test "$(git -C mono rev-parse HEAD)" = "$MONO_SHA"

      - name: Install Rust and RDMA build dependencies
        if: steps.server.outputs.reuse != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake libclang-dev libibverbs-dev \
            librdmacm-dev pkg-config protobuf-compiler
          rustup toolchain install 1.93.0 --profile minimal
          rustup default 1.93.0

      - name: Build RDMA Volume server
        if: steps.server.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          cd mono/enterprise/seaweed-volume
          cargo build --locked --release --features kvcache,rdma,rdma-dc
          install -D -m 0755 target/release/weed-volume \
            ../docker/weed-volume-prebuilt/weed-volume-amd64

      - name: Build and publish server image
        if: steps.server.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          docker build \
            --file mono/enterprise/docker/Dockerfile.rdma \
            --build-arg SOURCE_SHA="$MONO_SHA" \
            --tag "$SERVER_IMAGE" \
            mono/enterprise
          docker push "$SERVER_IMAGE"
          repo_digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$SERVER_IMAGE")
          test -n "$repo_digest"
          printf '%s\n' "$repo_digest" > server-image.txt
          docker run --rm "$repo_digest" version | grep -F "$MONO_SHA"

      # The two images used to build on separate runners, each with its own free
      # disk. In one job those peaks would add up, so release the server build's
      # footprint before the LMCache/CUDA base build starts. The server image is
      # already pushed and its digest is recorded in server-image.txt.
      - name: Reclaim disk before the runtime build
        if: steps.runtime.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          rm -rf mono/enterprise/seaweed-volume/target "$HOME/.cargo/registry" "$HOME/.rustup" || true
          if [ "${{ steps.server.outputs.reuse }}" != 'true' ]; then
            docker image rm "$SERVER_IMAGE" || true
          fi
          docker builder prune -af || true
          df -h /

      - name: Verify pinned LMCache source
        if: steps.runtime.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          test "${#LMCACHE_SHA}" -eq 40
          git clone --filter=blob:none https://github.com/LMCache/LMCache.git lmcache
          git -C lmcache checkout --detach "$LMCACHE_SHA"
          test "$(git -C lmcache rev-parse HEAD)" = "$LMCACHE_SHA"

      - name: Download and verify released connector wheel
        if: steps.runtime.outputs.reuse != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dist=mono/enterprise/python/seaweedkv-native/dist
          mkdir -p "$dist"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'seaweedkv_native-*.whl' \
            --dir "$dist"
          mapfile -t wheels < <(find "$dist" -maxdepth 1 -name 'seaweedkv_native-*.whl' -print)
          test "${#wheels[@]}" -eq 1
          wheel=${wheels[0]}
          actual=$(sha256sum "$wheel" | awk '{print $1}')
          echo "wheel_sha256=$actual"
          echo "expected_wheel_sha256=$EXPECTED_WHEEL_SHA256"
          test "$actual" = "$EXPECTED_WHEEL_SHA256"

      - name: Build pinned LMCache base image
        if: steps.runtime.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          docker build \
            --build-arg BUILDKIT_CONTEXT_KEEP_GIT_DIR=1 \
            --file docker/Dockerfile.standalone \
            --tag "lmcache-preview-base:${LMCACHE_SHA}" \
            "https://github.com/LMCache/LMCache.git#${LMCACHE_SHA}"
          docker run --rm "lmcache-preview-base:${LMCACHE_SHA}" \
            python -c 'import lmcache; print(lmcache)'

      - name: Build and publish runtime image
        if: steps.runtime.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          docker build \
            --file mono/enterprise/python/seaweedkv-native/docker/Dockerfile.runtime \
            --build-arg "LMCACHE_BASE_IMAGE=lmcache-preview-base:${LMCACHE_SHA}" \
            --build-arg "SEAWEEDFS_SOURCE_SHA=${MONO_SHA}" \
            --build-arg "LMCACHE_SOURCE_SHA=${LMCACHE_SHA}" \
            --build-arg "SEAWEEDKV_WHEEL_SHA256=${EXPECTED_WHEEL_SHA256}" \
            --tag "$RUNTIME_IMAGE" \
            mono/enterprise/python/seaweedkv-native
          docker push "$RUNTIME_IMAGE"
          repo_digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$RUNTIME_IMAGE")
          test -n "$repo_digest"
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$repo_digest")" = "$MONO_SHA"
          test "$(docker inspect --format '{{index .Config.Labels "ai.lmcache.source-revision"}}' "$repo_digest")" = "$LMCACHE_SHA"
          test "$(docker inspect --format '{{index .Config.Labels "ai.lmcache.wheel.sha256"}}' "$repo_digest")" = "$EXPECTED_WHEEL_SHA256"
          printf '%s\n' "$repo_digest" > runtime-image.txt
          docker run --rm "$repo_digest" \
            python -c 'from seaweedkv_native import SeaweedKVNativeConnector; print(SeaweedKVNativeConnector)'

      - name: Create registry attestation
        run: |
          set -euo pipefail
          server=$(cat server-image.txt)
          runtime=$(cat runtime-image.txt)
          jq -n \
            --arg release "$RELEASE_TAG" \
            --arg mono "$MONO_SHA" \
            --arg lmcache "$LMCACHE_SHA" \
            --arg wheel "$EXPECTED_WHEEL_SHA256" \
            --arg server "$server" \
            --arg runtime "$runtime" \
            '{schema_version:1, release:$release, seaweedfs_source_sha:$mono,
              lmcache_source_sha:$lmcache, wheel_sha256:$wheel,
              images:{seaweedfs:$server,lmcache_connector:$runtime}}' \
            > REGISTRY-IMAGES.json
          sha256sum REGISTRY-IMAGES.json > REGISTRY-SHA256SUMS

      - name: Upload attestation to existing prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$RELEASE_TAG" \
            REGISTRY-IMAGES.json REGISTRY-SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload image identities
        uses: actions/upload-artifact@v4
        with:
          name: kvcache-image-identities
          path: |
            server-image.txt
            runtime-image.txt
          if-no-files-found: error
