name: "Subscription Tracker"

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      email:
        description: "Send the license instructions to this address instead of polling Stripe"
        required: false

permissions:
  contents: read

concurrency:
  group: subscription-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Clone seaweed-mono (enterprise) source
        env:
          MONO_TOKEN: ${{ secrets.MONO_TOKEN }}
        run: git clone -b main --depth 1 https://x-access-token:${MONO_TOKEN}@github.com/seaweedfs/seaweed-mono.git seaweed-mono

      - name: Check the screenshot the license instructions attach
        working-directory: seaweed-mono/enterprise/license-manager
        run: |
          test -f cluster-uuid.png || {
            echo "cluster-uuid.png is missing, and the license instructions attach it."
            exit 1
          }

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'seaweed-mono/enterprise/go.mod'
          cache-dependency-path: 'seaweed-mono/enterprise/go.sum'

      - name: Check for new subscriptions
        working-directory: seaweed-mono/enterprise/license-manager
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          # uncomment once SMTP is enabled on the Zoho mailbox: until the
          # credentials reach it, the tracker records subscriptions and mails
          # nobody, rather than failing every run on a rejected login
          # ZOHO_EMAIL: ${{ secrets.ZOHO_EMAIL }}
          # ZOHO_PASSWORD: ${{ secrets.ZOHO_PASSWORD }}
          ZOHO_SMTP_ADDR: ${{ vars.ZOHO_SMTP_ADDR }}
          MANUAL_EMAIL: ${{ inputs.email }}
        run: |
          if [ -n "$MANUAL_EMAIL" ]; then
            go run ./subscription-tracker -email "$MANUAL_EMAIL"
          else
            go run ./subscription-tracker
          fi

      - name: Commit and push to seaweed-mono main
        working-directory: seaweed-mono
        run: |
          if git diff --quiet enterprise/license-manager/license_tracking.csv; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add enterprise/license-manager/license_tracking.csv
          git commit -m "license-manager: record new Stripe subscriptions"
          git pull --rebase origin main
          git push origin main
