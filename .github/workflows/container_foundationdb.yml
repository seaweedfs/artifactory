name: "Containers: FoundationDB"

on:
  push:
    tags:
      - '*'
      - '!vfs-*'   # vfs-<version> tags publish via seaweed-vfs-release.yml
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the container'
        required: true
        default: 'latest'

permissions:
  contents: read
  packages: write

jobs:
  # Fail fast when the release tag does not match the enterprise version
  # constants in seaweed-mono, so a stale (unsynced) enterprise build never
  # ships under a newer tag.
  verify-version:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout artifactory repo
        uses: actions/checkout@v6

      - name: Verify enterprise version matches release tag
        uses: ./.github/actions/verify-enterprise-version
        with:
          tag: ${{ inputs.tag_name || github.ref_name }}
          mono-token: ${{ secrets.MONO_TOKEN }}

  build-enterprise-foundationdb:
    needs: [verify-version]
    runs-on: ubuntu-24.04
    strategy:
      # One failing variant must not cancel the other mid-push, or the
      # release ships with a missing image.
      fail-fast: false
      matrix:
        include:
          # Normal volume format
          - variant: "foundationdb"
            suffix: "_foundationdb"
            build_args: "TAGS="
            description: "SeaweedFS Enterprise with FoundationDB filer store"
          # Large disk volume format (5BytesOffset)
          - variant: "foundationdb_large"
            suffix: "_large_disk_foundationdb"
            build_args: ""
            description: "SeaweedFS Enterprise with FoundationDB filer store and 5BytesOffset large-disk support"

    steps:
      - name: Checkout artifactory repo
        uses: actions/checkout@v6

      - name: Clone seaweed-mono (enterprise) source
        env:
          MONO_TOKEN: ${{ secrets.MONO_TOKEN }}
        run: |
          .github/scripts/git-retry.sh clone -b main https://x-access-token:${MONO_TOKEN}@github.com/seaweedfs/seaweed-mono.git seaweedfs-enterprise-source
          cd seaweedfs-enterprise-source
          echo "Cloned enterprise branch commit: $(git rev-parse HEAD)"
          echo "COMMIT_SHA=$(git rev-parse --short=8 HEAD)" >> $GITHUB_ENV

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: |
            chrislusf/seaweedfs-enterprise
            ghcr.io/seaweedfs/seaweedfs-enterprise
          tags: |
            type=ref,event=tag,suffix=${{ matrix.suffix }}
            type=raw,value=${{ inputs.tag_name }},suffix=${{ matrix.suffix }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,suffix=${{ matrix.suffix }},enable=true
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=seaweedfs-enterprise
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.vendor=Chris Lu

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ARM64 requires FoundationDB ARM64 client packages (7.4.5+); amd64 only for compatibility.
      - name: Build and push Docker image (FoundationDB)
        uses: docker/build-push-action@v7
        with:
          context: ./seaweedfs-enterprise-source/enterprise
          push: ${{ github.event_name != 'pull_request' }}
          file: ./seaweedfs-enterprise-source/enterprise/docker/Dockerfile.foundationdb_large
          build-args: |
            ${{ matrix.build_args }}
          platforms: linux/amd64
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
