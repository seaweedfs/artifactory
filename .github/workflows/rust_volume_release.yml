name: "rust: build enterprise volume server binaries"

# Mirrors the OSS rust_binaries_release.yml in seaweedfs/seaweedfs, but builds
# the Rust weed-volume from the private enterprise source (same as release.yml
# does for the Go weed binary) and publishes enterprise-marked assets + .md5.

on:
  push:
    tags:
      - '*'
      - '!vfs-*'   # vfs-<version> tags publish via seaweed-vfs-release.yml
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release'
        required: true
        default: 'latest'

permissions:
  contents: read

concurrency:
  group: rust-enterprise-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:

  # Fail fast when the release tag does not match the enterprise version
  # constants in seaweed-mono, so a stale (unsynced) enterprise build never
  # ships under a newer tag.
  verify-version:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout artifactory repo
        uses: actions/checkout@v6

      - name: Verify enterprise version matches release tag
        uses: ./.github/actions/verify-enterprise-version
        with:
          tag: ${{ inputs.tag_name || github.ref_name }}
          mono-token: ${{ secrets.MONO_TOKEN }}

  build-rust-volume-enterprise-linux:
    needs: [verify-version]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    strategy:
      # One architecture failing must not cancel the other's upload.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset_suffix: linux_amd64
          - target: aarch64-unknown-linux-gnu
            asset_suffix: linux_arm64
            cross: true

    steps:
      - name: Checkout artifactory repo
        uses: actions/checkout@v6

      - name: Clone seaweed-mono (enterprise) source
        env:
          MONO_TOKEN: ${{ secrets.MONO_TOKEN }}
        run: |
          .github/scripts/git-retry.sh clone -b main https://x-access-token:${MONO_TOKEN}@github.com/seaweedfs/seaweed-mono.git seaweedfs-enterprise-source
          cd seaweedfs-enterprise-source
          echo "Cloned enterprise branch commit: $(git rev-parse HEAD)"
          echo "COMMIT_SHA=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo dpkg --add-architecture arm64
          # ubuntu-24.04 keeps apt sources in deb822 ubuntu.sources, not
          # sources.list — pin them to amd64 so apt does not probe arm64
          # indexes on archive/security.ubuntu.com (they 404).
          sudo sed -i '/^Types: deb$/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          for suite in noble noble-updates noble-security; do
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $suite main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64.list
          done
          $GITHUB_WORKSPACE/.github/scripts/apt-retry.sh update
          $GITHUB_WORKSPACE/.github/scripts/apt-retry.sh install -y gcc-aarch64-linux-gnu libssl-dev:arm64
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "OPENSSL_DIR=/usr" >> "$GITHUB_ENV"
          echo "OPENSSL_INCLUDE_DIR=/usr/include" >> "$GITHUB_ENV"
          echo "OPENSSL_LIB_DIR=/usr/lib/aarch64-linux-gnu" >> "$GITHUB_ENV"

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            seaweedfs-enterprise-source/enterprise/seaweed-volume/target
          key: rust-enterprise-${{ matrix.target }}-${{ hashFiles('seaweedfs-enterprise-source/enterprise/seaweed-volume/Cargo.lock') }}
          restore-keys: |
            rust-enterprise-${{ matrix.target }}-

      - name: Build Rust volume server (large disk)
        env:
          SEAWEEDFS_COMMIT: ${{ env.COMMIT_SHA }}
        run: |
          cd seaweedfs-enterprise-source/enterprise/seaweed-volume
          cargo build --release --target ${{ matrix.target }} --target-dir target/large-disk

      - name: Build Rust volume server (normal)
        env:
          SEAWEEDFS_COMMIT: ${{ env.COMMIT_SHA }}
        run: |
          cd seaweedfs-enterprise-source/enterprise/seaweed-volume
          cargo build --release --target ${{ matrix.target }} --no-default-features --target-dir target/normal

      - name: Package binaries
        run: |
          # Build each variant into its own --target-dir so the second build
          # doesn't overwrite the first at the shared release path.
          root=seaweedfs-enterprise-source/enterprise/seaweed-volume/target
          cp "$root/large-disk/${{ matrix.target }}/release/weed-volume" weed-volume-large-disk
          tar czf weed-volume-enterprise_large_disk_${{ matrix.asset_suffix }}.tar.gz weed-volume-large-disk
          rm weed-volume-large-disk

          cp "$root/normal/${{ matrix.target }}/release/weed-volume" weed-volume-normal
          tar czf weed-volume-enterprise_${{ matrix.asset_suffix }}.tar.gz weed-volume-normal
          rm weed-volume-normal

      - name: Generate md5 checksums
        run: |
          for f in weed-volume-enterprise_large_disk_${{ matrix.asset_suffix }}.tar.gz weed-volume-enterprise_${{ matrix.asset_suffix }}.tar.gz; do
            md5sum "$f" > "$f.md5"
          done

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            weed-volume-enterprise_large_disk_${{ matrix.asset_suffix }}.tar.gz
            weed-volume-enterprise_large_disk_${{ matrix.asset_suffix }}.tar.gz.md5
            weed-volume-enterprise_${{ matrix.asset_suffix }}.tar.gz
            weed-volume-enterprise_${{ matrix.asset_suffix }}.tar.gz.md5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Native RC + mlx5 DC and the KV slab are opt-in assets. Keep the existing
  # normal/large-disk downloads and their ARM64 builds unchanged.
  build-rust-rdma-enterprise-linux-amd64:
    needs: [verify-version]
    outputs:
      mono_sha: ${{ steps.source.outputs.mono_sha }}
      asset_digests: ${{ steps.package.outputs.asset_digests }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout artifactory repo
        uses: actions/checkout@v6

      - name: Clone seaweed-mono (enterprise) source
        id: source
        env:
          MONO_TOKEN: ${{ secrets.MONO_TOKEN }}
        run: |
          .github/scripts/git-retry.sh clone -b main https://x-access-token:${MONO_TOKEN}@github.com/seaweedfs/seaweed-mono.git seaweedfs-enterprise-source
          cd seaweedfs-enterprise-source
          echo "COMMIT_SHA=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_ENV"
          git rev-parse HEAD > ../source-commit.txt
          echo "mono_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify release tag against the cloned source
        env:
          TAG: ${{ inputs.tag_name || github.ref_name }}
        run: python3 .github/scripts/verify-enterprise-checkout.py "$TAG" seaweedfs-enterprise-source

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install RDMA build dependencies
        run: |
          .github/scripts/apt-retry.sh update
          .github/scripts/apt-retry.sh install -y build-essential pkg-config clang libclang-dev libibverbs-dev librdmacm-dev libssl-dev protobuf-compiler

      - name: Build RDMA volume server (large disk and KV slab)
        env:
          SEAWEEDFS_COMMIT: ${{ env.COMMIT_SHA }}
        run: |
          cd seaweedfs-enterprise-source/enterprise/seaweed-volume
          cargo build --locked --release --target x86_64-unknown-linux-gnu --features rdma,rdma-dc,kvcache --bin weed-volume --target-dir target/rdma

      - name: Build S3 RDMA object service
        run: |
          cd seaweedfs-enterprise-source/enterprise/rust
          cargo build --locked --release --target x86_64-unknown-linux-gnu -p seaweedfs-sw-rdma-object --features mlx5-dc --bin sw-rdma-object-service --target-dir target/rdma

      - name: Package RDMA assets
        id: package
        run: |
          mkdir -p rdma-volume rdma-object
          cp seaweedfs-enterprise-source/enterprise/seaweed-volume/target/rdma/x86_64-unknown-linux-gnu/release/weed-volume rdma-volume/
          cp seaweedfs-enterprise-source/enterprise/rust/target/rdma/x86_64-unknown-linux-gnu/release/sw-rdma-object-service rdma-object/
          cp source-commit.txt rdma-volume/
          cp source-commit.txt rdma-object/
          cp docs/rdma-release-linux-amd64.md rdma-volume/README.md
          cp docs/rdma-release-linux-amd64.md rdma-object/README.md
          tar czf weed-volume-enterprise_rdma_large_disk_linux_amd64.tar.gz -C rdma-volume .
          tar czf sw-rdma-object-service-enterprise_linux_amd64.tar.gz -C rdma-object .
          for f in weed-volume-enterprise_rdma_large_disk_linux_amd64.tar.gz sw-rdma-object-service-enterprise_linux_amd64.tar.gz; do
            md5sum "$f" > "$f.md5"
            sha256sum "$f" > "$f.sha256"
          done
          python3 - <<'PYDIGEST'
          import hashlib, json, os, pathlib
          names = ["weed-volume-enterprise_rdma_large_disk_linux_amd64.tar.gz", "sw-rdma-object-service-enterprise_linux_amd64.tar.gz"]
          values = {n: hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest() for n in names}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('asset_digests=' + json.dumps(values), file=out)
          PYDIGEST

      - name: Upload RDMA release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            weed-volume-enterprise_rdma_large_disk_linux_amd64.tar.gz*
            sw-rdma-object-service-enterprise_linux_amd64.tar.gz*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # PREVIEW: both Python distributions and the bundled native RC/DC provider.
  # CPython 3.12 on Ubuntu 24.04 only; no manylinux/ARM64 compatibility claim.
  build-kv-native-preview-linux-amd64:
    needs: [verify-version, build-rust-rdma-enterprise-linux-amd64]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout artifactory repo
        uses: actions/checkout@v6

      - name: Clone enterprise source and verify this checkout
        env:
          MONO_TOKEN: ${{ secrets.MONO_TOKEN }}
          TAG: ${{ inputs.tag_name || github.ref_name }}
          SOURCE_SHA: ${{ needs.build-rust-rdma-enterprise-linux-amd64.outputs.mono_sha }}
        run: |
          test -n "$SOURCE_SHA"
          .github/scripts/git-retry.sh clone --no-checkout -b main https://x-access-token:${MONO_TOKEN}@github.com/seaweedfs/seaweed-mono.git seaweedfs-enterprise-source
          git -C seaweedfs-enterprise-source checkout --detach "$SOURCE_SHA"
          test "$(git -C seaweedfs-enterprise-source rev-parse HEAD)" = "$SOURCE_SHA"
          python3 .github/scripts/verify-enterprise-checkout.py "$TAG" seaweedfs-enterprise-source

      # The wheel's version is this release's enterprise version (4.54 -> 4.54.0), parsed from the checkout's
      # constants.go like verify-enterprise-checkout.py; never a hand-kept number and never a fallback.
      - name: Stamp the seaweedkv-native wheel version
        id: wheelver
        env:
          TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          version=$(python3 .github/scripts/kv-native-wheel-version.py "$TAG" seaweedfs-enterprise-source)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "seaweedkv-native wheel version ${version}"

      - name: Read preview pins
        id: pins
        run: |
          python3 - <<'PY'
          import json, os
          p = json.load(open('.github/kv-native-preview-pins.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              for k in ('rust', 'lmcache_commit'):
                  print(f'{k}={p[k]}', file=f)
          PY

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.pins.outputs.rust }}
          targets: x86_64-unknown-linux-gnu

      - name: Install native wheel build dependencies
        run: |
          .github/scripts/apt-retry.sh update
          .github/scripts/apt-retry.sh install -y build-essential pkg-config clang libclang-dev libibverbs-dev librdmacm-dev libssl-dev protobuf-compiler python3.12 python3.12-dev python3.12-venv

      - name: Checkout pinned LMCache headers
        env:
          LMCACHE_SHA: ${{ steps.pins.outputs.lmcache_commit }}
        run: |
          .github/scripts/git-retry.sh clone --filter=blob:none --no-checkout https://github.com/LMCache/LMCache.git lmcache-source
          git -C lmcache-source fetch --depth=1 origin "$LMCACHE_SHA"
          git -C lmcache-source checkout --detach "$LMCACHE_SHA"

      - name: Build and verify source-free preview wheels
        env:
          SEAWEEDKV_NATIVE_VERSION: ${{ steps.wheelver.outputs.version }}
        run: bash .github/scripts/kv-native-preview-build.sh seaweedfs-enterprise-source lmcache-source kv-native-preview

      # The same verified wheel, also published by itself so `pip install` needs no tarball.
      - name: Stage the standalone seaweedkv-native wheel
        env:
          VERSION: ${{ steps.wheelver.outputs.version }}
        run: |
          set -euo pipefail
          wheel="seaweedkv_native-${VERSION}-cp312-cp312-linux_x86_64.whl"
          built=$(cd kv-native-preview/wheels && ls seaweedkv_native-*.whl 2>/dev/null || true)   # none: named error below
          if [ "$built" != "$wheel" ]; then
            echo "::error::KV_WHEEL_VERSION_NOT_STAMPED: built '${built}', expected '${wheel}'"
            exit 1
          fi
          cp "kv-native-preview/wheels/${wheel}" .
          sha256sum "${wheel}" > "${wheel}.sha256"
          echo "WHEEL=${wheel}" >> "$GITHUB_ENV"

      - name: Package preview bundle
        run: |
          cp docs/kv-native-preview-packaging.md kv-native-preview/README.md
          tar czf seaweedkv-lmcache-native-preview_cp312_linux_amd64.tar.gz -C kv-native-preview wheels preview-pins.json BUILD-MANIFEST.json BUILD_INFO build-requirements.txt provider-ldd.txt dt-needed.json resolved-dependencies.json README.md
          md5sum seaweedkv-lmcache-native-preview_cp312_linux_amd64.tar.gz > seaweedkv-lmcache-native-preview_cp312_linux_amd64.tar.gz.md5
          sha256sum seaweedkv-lmcache-native-preview_cp312_linux_amd64.tar.gz > seaweedkv-lmcache-native-preview_cp312_linux_amd64.tar.gz.sha256

      - name: Check published server and preview source/digest pairing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag_name || github.ref_name }}
          SOURCE_SHA: ${{ needs.build-rust-rdma-enterprise-linux-amd64.outputs.mono_sha }}
          SERVER_DIGESTS: ${{ needs.build-rust-rdma-enterprise-linux-amd64.outputs.asset_digests }}
        run: |
          gh release download "$TAG" --pattern weed-volume-enterprise_rdma_large_disk_linux_amd64.tar.gz --pattern sw-rdma-object-service-enterprise_linux_amd64.tar.gz
          python3 .github/scripts/kv-native-preview-pair.py create . "$SOURCE_SHA" "$SERVER_DIGESTS" --wheel

      - name: Upload preview assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            seaweedkv-lmcache-native-preview_cp312_linux_amd64.tar.gz
            seaweedkv-lmcache-native-preview_cp312_linux_amd64.tar.gz.md5
            seaweedkv-lmcache-native-preview_cp312_linux_amd64.tar.gz.sha256
            seaweedkv-preview-pair.json
            ${{ env.WHEEL }}
            ${{ env.WHEEL }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The KV cache install docs (agent skill bundle, human quickstart, llms.txt index) live in the private seaweed-mono,
  # so each release also publishes them, from the same source commit as its RDMA volume and native wheel assets.
  publish-kvcache-docs:
    needs: [verify-version, build-rust-rdma-enterprise-linux-amd64]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout artifactory repo
        uses: actions/checkout@v6

      - name: Clone enterprise source and verify this checkout
        env:
          MONO_TOKEN: ${{ secrets.MONO_TOKEN }}
          TAG: ${{ inputs.tag_name || github.ref_name }}
          SOURCE_SHA: ${{ needs.build-rust-rdma-enterprise-linux-amd64.outputs.mono_sha }}
        run: |
          test -n "$SOURCE_SHA"
          .github/scripts/git-retry.sh clone --no-checkout -b main https://x-access-token:${MONO_TOKEN}@github.com/seaweedfs/seaweed-mono.git seaweedfs-enterprise-source
          git -C seaweedfs-enterprise-source checkout --detach "$SOURCE_SHA"
          test "$(git -C seaweedfs-enterprise-source rev-parse HEAD)" = "$SOURCE_SHA"
          python3 .github/scripts/verify-enterprise-checkout.py "$TAG" seaweedfs-enterprise-source

      # The skill is a self-contained folder (SKILL.md + the files it links), packed reproducibly from the commit.
      - name: Stage the KV cache install docs
        env:
          SOURCE_SHA: ${{ needs.build-rust-rdma-enterprise-linux-amd64.outputs.mono_sha }}
        run: |
          set -euo pipefail
          src=seaweedfs-enterprise-source
          for f in docs/skills/seaweedfs-kvcache/SKILL.md docs/KVCACHE-QUICKSTART.md docs/kvcache-llms.txt; do
            if [ ! -s "${src}/${f}" ]; then
              echo "::error::KV_DOCS_MISSING: ${f} is absent or empty at mono ${SOURCE_SHA}"
              exit 1
            fi
          done
          mkdir kvcache-docs
          cp -R "${src}/docs/skills/seaweedfs-kvcache" kvcache-docs/seaweedfs-kvcache
          cp "${src}/docs/KVCACHE-QUICKSTART.md" KVCACHE-QUICKSTART.md
          cp "${src}/docs/kvcache-llms.txt" llms.txt
          python3 .github/scripts/check-kvcache-release-docs.py content kvcache-docs/seaweedfs-kvcache KVCACHE-QUICKSTART.md llms.txt
          epoch=$(git -C "${src}" show -s --format=%ct HEAD)
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@${epoch}" -C kvcache-docs -cf - seaweedfs-kvcache \
            | gzip -n > seaweedfs-kvcache-skill.tar.gz
          for f in seaweedfs-kvcache-skill.tar.gz KVCACHE-QUICKSTART.md llms.txt; do sha256sum "${f}" > "${f}.sha256"; done

      - name: Upload KV cache install docs
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            seaweedfs-kvcache-skill.tar.gz
            seaweedfs-kvcache-skill.tar.gz.sha256
            KVCACHE-QUICKSTART.md
            KVCACHE-QUICKSTART.md.sha256
            llms.txt
            llms.txt.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the release carries the docs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json assets --jq '.assets[].name' > release-assets.txt
          python3 .github/scripts/check-kvcache-release-docs.py assets "$TAG" release-assets.txt

  # swctl installs from a release directory bound by manifest.json (swctl.release-manifest/v1). Build it from this
  # release's own verified assets and source commit, check it with swctl itself, and publish it.
  build-swctl-kv-release-linux-amd64:
    needs: [verify-version, build-rust-rdma-enterprise-linux-amd64, build-kv-native-preview-linux-amd64]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag_name || github.ref_name }}
      SOURCE_SHA: ${{ needs.build-rust-rdma-enterprise-linux-amd64.outputs.mono_sha }}
    steps:
      - name: Checkout artifactory repo
        uses: actions/checkout@v6

      - name: Clone enterprise source and verify this checkout
        env:
          MONO_TOKEN: ${{ secrets.MONO_TOKEN }}
        run: |
          test -n "$SOURCE_SHA"
          .github/scripts/git-retry.sh clone --no-checkout -b main https://x-access-token:${MONO_TOKEN}@github.com/seaweedfs/seaweed-mono.git seaweedfs-enterprise-source
          git -C seaweedfs-enterprise-source checkout --detach "$SOURCE_SHA"
          test "$(git -C seaweedfs-enterprise-source rev-parse HEAD)" = "$SOURCE_SHA"
          python3 .github/scripts/verify-enterprise-checkout.py "$TAG" seaweedfs-enterprise-source
          echo "VERSION=$(python3 .github/scripts/kv-native-wheel-version.py "$TAG" seaweedfs-enterprise-source)" >> "$GITHUB_ENV"
          echo "LMCACHE_COMMIT=$(jq -er .lmcache_commit .github/kv-native-preview-pins.json)" >> "$GITHUB_ENV"
          echo "NATIVE_LIB=$(jq -er .native_lib .github/swctl-kv-release.json)" >> "$GITHUB_ENV"

      - name: Install the source's Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version-file: seaweedfs-enterprise-source/enterprise/go.mod
          cache: false

      # weed: the same flags as release.yml's large-disk weed (the RDMA volume is large disk), at this source commit.
      - name: Build weed and the checking swctl
        run: |
          set -euo pipefail
          mkdir swctl-kv-release
          cd seaweedfs-enterprise-source/enterprise
          CGO_ENABLED=0 GODEBUG=http2client=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -tags 5BytesOffset \
            -ldflags "-s -w -extldflags -static -X github.com/seaweedfs/seaweedfs/weed/util/version.COMMIT=${SOURCE_SHA:0:8}" \
            -o ../../swctl-kv-release/weed ./weed
          CGO_ENABLED=0 go build -buildvcs=false -o ../../swctl-check ./cmd/swctl
          echo "GO_VERSION=$(go env GOVERSION)" >> "$GITHUB_ENV"

      - name: Collect this release's weed-volume, native wheel and native library
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          wheel="seaweedkv_native-${VERSION}-cp312-cp312-linux_x86_64.whl"
          gh release download "$TAG" --pattern weed-volume-enterprise_rdma_large_disk_linux_amd64.tar.gz \
            --pattern sw-rdma-object-service-enterprise_linux_amd64.tar.gz \
            --pattern seaweedkv-lmcache-native-preview_cp312_linux_amd64.tar.gz \
            --pattern seaweedkv-preview-pair.json --pattern "${wheel}" --pattern "${wheel}.sha256"
          python3 .github/scripts/kv-native-preview-pair.py verify . seaweedkv-preview-pair.json --wheel
          paired=$(jq -er .mono_commit seaweedkv-preview-pair.json)
          if [ "$paired" != "$SOURCE_SHA" ]; then
            echo "::error::KV_RELEASE_INPUT: published assets are from mono ${paired}, this run is ${SOURCE_SHA}"
            exit 1
          fi
          tar -xzf weed-volume-enterprise_rdma_large_disk_linux_amd64.tar.gz -C swctl-kv-release ./weed-volume
          cp "${wheel}" swctl-kv-release/
          python3 .github/scripts/kv-release-manifest.py extract-lib "${wheel}" "${NATIVE_LIB}" "swctl-kv-release/${NATIVE_LIB}"

      - name: Fetch the pinned LMCache wheel
        run: |
          set -euo pipefail
          pin=.github/swctl-kv-release.json
          printf 'lmcache==%s --hash=sha256:%s\n' "$(jq -er .lmcache_wheel.version $pin)" "$(jq -er .lmcache_wheel.sha256 $pin)" > lmcache-requirement.txt
          python3 -m pip download --no-deps --require-hashes --only-binary=:all: --implementation cp --python-version 3.12 \
            --abi cp312 --platform manylinux_2_28_x86_64 -r lmcache-requirement.txt -d swctl-kv-release
          test -f "swctl-kv-release/$(jq -er .lmcache_wheel.name $pin)"

      - name: Write the manifest and check the directory
        run: |
          set -euo pipefail
          python3 .github/scripts/kv-release-manifest.py create swctl-kv-release "$TAG" "$VERSION" "$SOURCE_SHA" \
            "$GO_VERSION" "$LMCACHE_COMMIT" .github/swctl-kv-release.json
          ls -l swctl-kv-release

      # The real reader: swctl from this source commit must accept the manifest through the published cluster template.
      - name: Check the manifest with swctl itself
        run: |
          set -euo pipefail
          template=seaweedfs-enterprise-source/docs/skills/seaweedfs-kvcache/cluster.yaml
          if [ ! -s "$template" ]; then
            echo "::error::KV_RELEASE_INPUT: ${template} is absent at mono ${SOURCE_SHA}"
            exit 1
          fi
          check=$(mktemp -d)
          ssh-keygen -q -t ed25519 -N '' -f "$check/key"
          python3 .github/scripts/kv-release-manifest.py check-cluster "$template" "$PWD/swctl-kv-release" "$check" > "$check/cluster.yaml"
          ./swctl-check plan install --cluster "$check/cluster.yaml" --json > swctl-plan-check.json
          jq -e '.status == "PASS" and .mutating == false' swctl-plan-check.json

      - name: Package the release directory
        run: |
          set -euo pipefail
          epoch=$(git -C seaweedfs-enterprise-source show -s --format=%ct HEAD)
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@${epoch}" -cf - swctl-kv-release \
            | gzip -n > swctl-kv-release_linux_amd64.tar.gz
          cp swctl-kv-release/manifest.json swctl-kv-release_linux_amd64.manifest.json
          for f in swctl-kv-release_linux_amd64.tar.gz swctl-kv-release_linux_amd64.manifest.json; do sha256sum "$f" > "$f.sha256"; done

      - name: Upload the swctl KV release directory
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            swctl-kv-release_linux_amd64.tar.gz
            swctl-kv-release_linux_amd64.tar.gz.sha256
            swctl-kv-release_linux_amd64.manifest.json
            swctl-kv-release_linux_amd64.manifest.json.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the release carries it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json assets --jq '.assets[].name' > release-assets.txt
          python3 .github/scripts/kv-release-manifest.py assets "$TAG" release-assets.txt
