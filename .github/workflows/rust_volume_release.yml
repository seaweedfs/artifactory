name: "rust: build enterprise volume server binaries"

# Mirrors the OSS rust_binaries_release.yml in seaweedfs/seaweedfs, but builds
# the Rust weed-volume from the private enterprise source (same as release.yml
# does for the Go weed binary) and publishes enterprise-marked assets + .md5.

on:
  push:
    tags:
      - '*'
      - '!vfs-*'   # vfs-<version> tags publish via seaweed-vfs-release.yml
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release'
        required: true
        default: 'latest'

permissions:
  contents: read

jobs:

  # Fail fast when the release tag does not match the enterprise version
  # constants in seaweed-mono, so a stale (unsynced) enterprise build never
  # ships under a newer tag.
  verify-version:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout artifactory repo
        uses: actions/checkout@v6

      - name: Verify enterprise version matches release tag
        uses: ./.github/actions/verify-enterprise-version
        with:
          tag: ${{ inputs.tag_name || github.ref_name }}
          mono-token: ${{ secrets.MONO_TOKEN }}

  build-rust-volume-enterprise-linux:
    needs: [verify-version]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    strategy:
      # One architecture failing must not cancel the other's upload.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset_suffix: linux_amd64
          - target: aarch64-unknown-linux-gnu
            asset_suffix: linux_arm64
            cross: true

    steps:
      - name: Checkout artifactory repo
        uses: actions/checkout@v6

      - name: Clone seaweed-mono (enterprise) source
        env:
          MONO_TOKEN: ${{ secrets.MONO_TOKEN }}
        run: |
          .github/scripts/git-retry.sh clone -b main https://x-access-token:${MONO_TOKEN}@github.com/seaweedfs/seaweed-mono.git seaweedfs-enterprise-source
          cd seaweedfs-enterprise-source
          echo "Cloned enterprise branch commit: $(git rev-parse HEAD)"
          echo "COMMIT_SHA=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo dpkg --add-architecture arm64
          # ubuntu-24.04 keeps apt sources in deb822 ubuntu.sources, not
          # sources.list — pin them to amd64 so apt does not probe arm64
          # indexes on archive/security.ubuntu.com (they 404).
          sudo sed -i '/^Types: deb$/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          for suite in noble noble-updates noble-security; do
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $suite main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64.list
          done
          $GITHUB_WORKSPACE/.github/scripts/apt-retry.sh update
          $GITHUB_WORKSPACE/.github/scripts/apt-retry.sh install -y gcc-aarch64-linux-gnu libssl-dev:arm64
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "OPENSSL_DIR=/usr" >> "$GITHUB_ENV"
          echo "OPENSSL_INCLUDE_DIR=/usr/include" >> "$GITHUB_ENV"
          echo "OPENSSL_LIB_DIR=/usr/lib/aarch64-linux-gnu" >> "$GITHUB_ENV"

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            seaweedfs-enterprise-source/enterprise/seaweed-volume/target
          key: rust-enterprise-${{ matrix.target }}-${{ hashFiles('seaweedfs-enterprise-source/enterprise/seaweed-volume/Cargo.lock') }}
          restore-keys: |
            rust-enterprise-${{ matrix.target }}-

      - name: Build Rust volume server (large disk)
        env:
          SEAWEEDFS_COMMIT: ${{ env.COMMIT_SHA }}
        run: |
          cd seaweedfs-enterprise-source/enterprise/seaweed-volume
          cargo build --release --target ${{ matrix.target }} --target-dir target/large-disk

      - name: Build Rust volume server (normal)
        env:
          SEAWEEDFS_COMMIT: ${{ env.COMMIT_SHA }}
        run: |
          cd seaweedfs-enterprise-source/enterprise/seaweed-volume
          cargo build --release --target ${{ matrix.target }} --no-default-features --target-dir target/normal

      - name: Package binaries
        run: |
          # Build each variant into its own --target-dir so the second build
          # doesn't overwrite the first at the shared release path.
          root=seaweedfs-enterprise-source/enterprise/seaweed-volume/target
          cp "$root/large-disk/${{ matrix.target }}/release/weed-volume" weed-volume-large-disk
          tar czf weed-volume-enterprise_large_disk_${{ matrix.asset_suffix }}.tar.gz weed-volume-large-disk
          rm weed-volume-large-disk

          cp "$root/normal/${{ matrix.target }}/release/weed-volume" weed-volume-normal
          tar czf weed-volume-enterprise_${{ matrix.asset_suffix }}.tar.gz weed-volume-normal
          rm weed-volume-normal

      - name: Generate md5 checksums
        run: |
          for f in weed-volume-enterprise_large_disk_${{ matrix.asset_suffix }}.tar.gz weed-volume-enterprise_${{ matrix.asset_suffix }}.tar.gz; do
            md5sum "$f" > "$f.md5"
          done

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            weed-volume-enterprise_large_disk_${{ matrix.asset_suffix }}.tar.gz
            weed-volume-enterprise_large_disk_${{ matrix.asset_suffix }}.tar.gz.md5
            weed-volume-enterprise_${{ matrix.asset_suffix }}.tar.gz
            weed-volume-enterprise_${{ matrix.asset_suffix }}.tar.gz.md5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Native RC + mlx5 DC and the KV slab are opt-in assets. Keep the existing
  # normal/large-disk downloads and their ARM64 builds unchanged.
  build-rust-rdma-enterprise-linux-amd64:
    needs: [verify-version]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout artifactory repo
        uses: actions/checkout@v6

      - name: Clone seaweed-mono (enterprise) source
        env:
          MONO_TOKEN: ${{ secrets.MONO_TOKEN }}
        run: |
          .github/scripts/git-retry.sh clone -b main https://x-access-token:${MONO_TOKEN}@github.com/seaweedfs/seaweed-mono.git seaweedfs-enterprise-source
          cd seaweedfs-enterprise-source
          echo "COMMIT_SHA=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_ENV"
          git rev-parse HEAD > ../source-commit.txt

      - name: Verify release tag against the cloned source
        env:
          TAG: ${{ inputs.tag_name || github.ref_name }}
        run: python3 .github/scripts/verify-enterprise-checkout.py "$TAG" seaweedfs-enterprise-source

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install RDMA build dependencies
        run: |
          .github/scripts/apt-retry.sh update
          .github/scripts/apt-retry.sh install -y build-essential pkg-config clang libclang-dev libibverbs-dev librdmacm-dev libssl-dev protobuf-compiler

      - name: Build RDMA volume server (large disk and KV slab)
        env:
          SEAWEEDFS_COMMIT: ${{ env.COMMIT_SHA }}
        run: |
          cd seaweedfs-enterprise-source/enterprise/seaweed-volume
          cargo build --locked --release --target x86_64-unknown-linux-gnu --features rdma,rdma-dc,kvcache --bin weed-volume --target-dir target/rdma

      - name: Build S3 RDMA object service
        run: |
          cd seaweedfs-enterprise-source/enterprise/rust
          cargo build --locked --release --target x86_64-unknown-linux-gnu -p seaweedfs-sw-rdma-object --features mlx5-dc --bin sw-rdma-object-service --target-dir target/rdma

      - name: Package RDMA assets
        run: |
          mkdir -p rdma-volume rdma-object
          cp seaweedfs-enterprise-source/enterprise/seaweed-volume/target/rdma/x86_64-unknown-linux-gnu/release/weed-volume rdma-volume/
          cp seaweedfs-enterprise-source/enterprise/rust/target/rdma/x86_64-unknown-linux-gnu/release/sw-rdma-object-service rdma-object/
          cp source-commit.txt rdma-volume/
          cp source-commit.txt rdma-object/
          cp docs/rdma-release-linux-amd64.md rdma-volume/README.md
          cp docs/rdma-release-linux-amd64.md rdma-object/README.md
          tar czf weed-volume-enterprise_rdma_large_disk_linux_amd64.tar.gz -C rdma-volume .
          tar czf sw-rdma-object-service-enterprise_linux_amd64.tar.gz -C rdma-object .
          for f in weed-volume-enterprise_rdma_large_disk_linux_amd64.tar.gz sw-rdma-object-service-enterprise_linux_amd64.tar.gz; do
            md5sum "$f" > "$f.md5"
            sha256sum "$f" > "$f.sha256"
          done

      - name: Upload RDMA release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            weed-volume-enterprise_rdma_large_disk_linux_amd64.tar.gz*
            sw-rdma-object-service-enterprise_linux_amd64.tar.gz*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # PREVIEW: both Python distributions and the bundled native RC/DC provider.
  # CPython 3.12 on Ubuntu 24.04 only; no manylinux/ARM64 compatibility claim.
  build-kv-native-preview-linux-amd64:
    needs: [verify-version]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout artifactory repo
        uses: actions/checkout@v6

      - name: Clone enterprise source and verify this checkout
        env:
          MONO_TOKEN: ${{ secrets.MONO_TOKEN }}
          TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          .github/scripts/git-retry.sh clone -b main https://x-access-token:${MONO_TOKEN}@github.com/seaweedfs/seaweed-mono.git seaweedfs-enterprise-source
          python3 .github/scripts/verify-enterprise-checkout.py "$TAG" seaweedfs-enterprise-source

      - name: Read preview pins
        id: pins
        run: |
          python3 - <<'PY'
          import json, os
          p = json.load(open('.github/kv-native-preview-pins.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              for k in ('rust', 'lmcache_commit'):
                  print(f'{k}={p[k]}', file=f)
          PY

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.pins.outputs.rust }}
          targets: x86_64-unknown-linux-gnu

      - name: Install native wheel build dependencies
        run: |
          .github/scripts/apt-retry.sh update
          .github/scripts/apt-retry.sh install -y build-essential pkg-config clang libclang-dev libibverbs-dev librdmacm-dev libssl-dev protobuf-compiler python3.12 python3.12-dev python3.12-venv

      - name: Checkout pinned LMCache headers
        env:
          LMCACHE_SHA: ${{ steps.pins.outputs.lmcache_commit }}
        run: |
          .github/scripts/git-retry.sh clone --filter=blob:none --no-checkout https://github.com/LMCache/LMCache.git lmcache-source
          git -C lmcache-source fetch --depth=1 origin "$LMCACHE_SHA"
          git -C lmcache-source checkout --detach "$LMCACHE_SHA"

      - name: Build and verify source-free preview wheels
        run: bash .github/scripts/kv-native-preview-build.sh seaweedfs-enterprise-source lmcache-source kv-native-preview

      - name: Package preview bundle
        run: |
          cp docs/kv-native-preview-packaging.md kv-native-preview/README.md
          tar czf seaweedkv-lmcache-native-preview_cp312_linux_amd64.tar.gz -C kv-native-preview wheels preview-pins.json BUILD-MANIFEST.json build-requirements.txt provider-ldd.txt README.md
          md5sum seaweedkv-lmcache-native-preview_cp312_linux_amd64.tar.gz > seaweedkv-lmcache-native-preview_cp312_linux_amd64.tar.gz.md5
          sha256sum seaweedkv-lmcache-native-preview_cp312_linux_amd64.tar.gz > seaweedkv-lmcache-native-preview_cp312_linux_amd64.tar.gz.sha256

      - name: Upload preview assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            seaweedkv-lmcache-native-preview_cp312_linux_amd64.tar.gz
            seaweedkv-lmcache-native-preview_cp312_linux_amd64.tar.gz.md5
            seaweedkv-lmcache-native-preview_cp312_linux_amd64.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
