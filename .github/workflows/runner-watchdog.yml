name: "runner watchdog: rescue jobs stuck on tp01"

# There is no "or else" in runs-on: a job pinned to [self-hosted, tp01] queues
# for up to 24 h if tp01 is offline and never falls back. This scheduled job is
# the fallback. It judges the symptom, not the runner (listing runners needs
# admin; the queue does not): a run queued on a self-hosted label for longer
# than the limit is cancelled and re-dispatched on GitHub-hosted with the same
# inputs, which the target workflow carries in its run name.
#
# It runs on hosted on purpose - a watchdog on tp01 would die with tp01. Runs
# queued on hosted labels are never touched: that is ordinary queue pressure,
# not an outage. The re-dispatched run carries runner=hosted, so it is ignored
# on the next pass and cannot loop.
#
# BUSY IS NOT OFFLINE. tp01 is one runner instance, so a mono push serialises
# roughly 85 jobs behind it and a queue many minutes deep is the normal, healthy
# state - rescuing on queue age alone would evacuate the whole wave to hosted
# and defeat the runner. The rescue rule is therefore:
#
#   rescue only when NO job has STARTED on a tp01 runner in the last N minutes
#   while jobs are queued for it.
#
# A runner that is merely saturated still finishes jobs and starts the next one,
# so a recent start proves it is alive no matter how long the queue is. Only
# "queued for N minutes AND nothing has started in N minutes" means offline.
# The liveness probe reads jobs from recent runs of the watched workflows and
# looks at runner_name, which the jobs API reports without admin.

on:
  # The schedule is BEST EFFORT, not a guarantee. Measured over 20 consecutive
  # scheduled runs on this repository: median gap 159 minutes, worst 5.5 hours,
  # every run succeeding. GitHub does not dispatch a */10 cron every 10 minutes
  # on a busy repo, so a rescue that depends only on this can be hours late.
  schedule:
    - cron: "*/10 * * * *"

  # The workflow_run trigger that used to fire after every watched suite was
  # removed on 2026-09-10: an external cron (cron-job.org) has dispatched this
  # workflow every 10 minutes since 2026-09-09 (110 dispatches in one day), so
  # the trigger only produced ~350 extra watchdog runs a day, most cancelled by
  # the concurrency group, and those runs crowded the liveness probe's window
  # (see the probe note below).

  workflow_dispatch:
    inputs:
      max_queue_minutes:
        description: "Queued this long on a self-hosted label with no job start on tp01 means the runner is down"
        default: "10"
      probe_window_minutes:
        description: "How far back to look for the last job start on a tp01 runner"
        default: "120"

permissions:
  actions: write
  contents: read

concurrency:
  group: runner-watchdog
  cancel-in-progress: false

jobs:
  rescue:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAX_MIN: ${{ inputs.max_queue_minutes || '10' }}
      # How far back the liveness probe looks for a job start on tp01. Wider than
      # MAX_MIN on purpose: it only has to find one start, and a wide window over
      # a quiet period costs a few API calls, while a narrow one would call an
      # idle-but-healthy runner dead.
      PROBE_WINDOW_MIN: ${{ inputs.probe_window_minutes || '120' }}
      # Every workflow that can land on a self-hosted label. A workflow missing
      # from this list queues on an offline tp01 until it times out after 24 h.
      WORKFLOWS: >-
        kvcache-preview.yml
        e2e.yml
        ec-degraded-read-tests.yml
        ec-integration-tests.yml
        ec-repair-plugin.yml
        fuse-integration.yml
        go.yml
        kafka-tests.yml
        plugin-workers.yml
        postgres-tests.yml
        rust-volume-server-tests.yml
        s3-go-tests.yml
        s3tests.yml
        seaweed-vfs.yml
        volume-server-integration-tests.yml
        volume-tiering-tests.yml
    steps:
      - name: Rescue runs queued on a self-hosted label past the limit
        run: |
          set -euo pipefail
          now=$(date -u +%s)

          # Liveness probe: how many minutes since a job last STARTED on a tp01
          # runner. A saturated runner keeps starting jobs, so a recent start
          # proves it is alive however deep the queue is; only silence means
          # offline. runner_name is reported by the jobs API without admin, and
          # the prefix match covers additional instances (tp01-2, tp01-3, ...).
          since=$(date -u -d "-${PROBE_WINDOW_MIN} minutes" +%Y-%m-%dT%H:%M:%SZ)
          newest=0
          # Scan runs that actually STARTED jobs (in_progress or completed), 200
          # of them, and skip this watchdog's own runs and the status mirror.
          # The old probe looked at the newest 50 runs of any state; on
          # 2026-09-10 those were all watchdog/mirror/cancelled runs, so it saw
          # "no job start in 120 min" while both tp01 workers were busy and
          # evacuated four queued builds to hosted (run 34509663939).
          probe_jq=".workflow_runs[] | select(.updated_at >= \"$since\") | select(.name | test(\"^(runner watchdog|Report status)\") | not) | .id"
          for rid in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=in_progress&per_page=100" --jq "$probe_jq"; \
                       gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=completed&per_page=100" --jq "$probe_jq"); do
            started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$rid/jobs?per_page=100" \
              --jq '[.jobs[] | select(.runner_name != null and (.runner_name | startswith("tp01")) and .started_at != null) | .started_at | fromdate] | max // 0')
            if [ "$started" -gt "$newest" ]; then newest=$started; fi
          done
          if [ "$newest" -eq 0 ]; then
            TP01_LAST_START=99999
            echo "tp01 liveness: no job start seen in the last ${PROBE_WINDOW_MIN}m"
          else
            TP01_LAST_START=$(( (now - newest) / 60 ))
            echo "tp01 liveness: last job started ${TP01_LAST_START}m ago"
          fi

          for wf in $WORKFLOWS; do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" --status queued --limit 20 \
              --json databaseId,createdAt,headBranch,displayTitle > queued.json
            jq -r '.[] | [.databaseId,.createdAt,.headBranch,.displayTitle] | @tsv' queued.json |
            while IFS=$'\t' read -r id created branch title; do
              age=$(( (now - $(date -u -d "$created" +%s)) / 60 ))
              labels=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
                --jq '[.jobs[] | select(.status=="queued") | .labels[]] | unique | join(",")')
              case ",$labels," in
                *,self-hosted,*) ;;
                *) echo "run $id: queued ${age}m on hosted labels [$labels] - ordinary queue, leaving it"; continue ;;
              esac
              if [ "$age" -lt "$MAX_MIN" ]; then echo "run $id: queued ${age}m on [$labels] - under the ${MAX_MIN}m limit"; continue; fi
              # Busy is not offline. One runner serialises a whole mono push, so a
              # deep queue is the healthy state; evacuating it to hosted would
              # defeat the runner. Only silence on tp01 counts as an outage.
              if [ "$TP01_LAST_START" -lt "$MAX_MIN" ]; then
                echo "run $id: queued ${age}m, but tp01 started a job ${TP01_LAST_START}m ago - busy, not offline; leaving it"
                continue
              fi
              mono=$(echo "$title" | grep -oE 'mono:[0-9a-f]+' | cut -d: -f2 || true)
              tag=$(echo "$title" | grep -oE 'tag:[^ ]+' | cut -d: -f2 || true)
              gitlab_branch=$(echo "$title" | grep -oE 'branch:[^ ]+' | cut -d: -f2- || true)
              echo "run $id: queued ${age}m on [$labels] - RESCUING (branch=$branch mono=${mono:-default} tag=${tag:-default} gitlab_branch=${gitlab_branch:-default})"
              # A dispatch naming an input the target workflow does not declare
              # is rejected outright ("Unexpected inputs provided"), and the
              # watched workflows declare different sets: mono_sha/release_tag
              # belong to kvcache-preview, gitlab_branch to the test suites. So
              # read the workflow file and pass only what it accepts. The `if`
              # form matters too: a bare `[ -n "$x" ] && args+=(...)` is the last
              # command of an && list, so under `set -e` an empty field would
              # kill the rescue loop instead of skipping the input.
              declared=$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/$wf?ref=$branch" --jq .content | base64 -d)
              gh run cancel "$id" --repo "$GITHUB_REPOSITORY"
              args=(-f runner=hosted)
              if [ -n "$mono" ] && grep -qE '^ +mono_sha:' <<<"$declared"; then args+=(-f "mono_sha=$mono"); fi
              if [ -n "$tag" ] && grep -qE '^ +release_tag:' <<<"$declared"; then args+=(-f "release_tag=$tag"); fi
              if [ -n "$gitlab_branch" ] && grep -qE '^ +gitlab_branch:' <<<"$declared"; then args+=(-f "gitlab_branch=$gitlab_branch"); fi
              gh workflow run "$wf" --repo "$GITHUB_REPOSITORY" --ref "$branch" "${args[@]}"
              {
                echo "### Rescued run $id ($wf)"
                echo "Queued ${age} min on \`$labels\` - the self-hosted runner is down. Cancelled and re-dispatched on hosted: branch \`$branch\`, mono \`${mono:-default}\`, tag \`${tag:-default}\`, gitlab_branch \`${gitlab_branch:-default}\`."
              } >> "$GITHUB_STEP_SUMMARY"
            done
          done
          echo "done"
